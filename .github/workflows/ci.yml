name: split-05 publish validated source

on:
  push:
    branches: [split-05]
    paths: ['.github/workflows/ci.yml']

permissions:
  contents: write
  actions: read

concurrency:
  group: split05-audited-migration
  cancel-in-progress: false

jobs:
  publish-validated-source:
    if: github.ref == 'refs/heads/split-05'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retrieve the completed correctness comparison
        uses: actions/download-artifact@v4
        with:
          name: split05-correctness-evidence
          run-id: 35116500029
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/split05-validated
      - name: Reproduce exactly the source that passed the comparison
        run: |
          test ! -e src/quickjs/internal-canonical.h
          python3 tools/split05.py
          python3 tools/check_split05.py --expect-digest 91cbbca8ec7c3256a342aeaa2d526374cfb446852fd46812ae1f48c79c3bed29 --report "$RUNNER_TEMP/split05-publish-audit.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          evidence = Path(os.environ['RUNNER_TEMP']) / 'split05-validated'
          report = json.loads((evidence / 'validation.json').read_text())
          previous_audit = json.loads((evidence / 'source-audit.json').read_text())
          audit = json.loads((Path(os.environ['RUNNER_TEMP']) / 'split05-publish-audit.json').read_text())
          assert report['success'] and not report['performance_tested']
          assert report['base'] == 'b63ab025d402e46c647a8a239bffe72a58f73a35'
          assert not audit['errors'] and not previous_audit['errors']
          assert audit['source_manifest'] == previous_audit['source_manifest']
          for compiler in ('gcc', 'clang'):
              result = report['compilers'][compiler]
              assert result['exports_match'] and result['test262_failure_sets_match']
              assert result['baseline']['test262'] == result['candidate']['test262']
              assert result['candidate']['test262']['total'] >= 50000
              assert result['candidate']['build'] == result['candidate']['built_in_tests'] == 'PASS'
              assert (evidence / (compiler + '-baseline-test262.errors')).read_bytes() == (evidence / (compiler + '-candidate-test262.errors')).read_bytes()
          report['validation_workflow_run'] = 35116500029
          report['validation_artifact_id'] = 10454239335
          report['source_digest'] = audit['source_digest']
          for key in ('function_definitions', 'unique_functions', 'data_definitions', 'private_header_function_definitions'):
              report[key] = audit[key]
          report['source_fidelity_errors'] = audit['errors']
          Path('SPLIT-05-VALIDATION.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - name: Publish source only; workflow changes are handled separately
        run: |
          git add src/quickjs quickjs.h Makefile split05-inventory.json SPLIT-05-VALIDATION.json
          git diff --cached --check > "$RUNNER_TEMP/split05-publish-diff.log" 2>&1 || true
          git -c core.whitespace=-blank-at-eol diff --cached --check
          test "$(git ls-remote origin refs/heads/split-05 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(split-05): restore upstream bodies and split engine ownership'
          git push origin HEAD:refs/heads/split-05
          git rev-parse HEAD | tee "$RUNNER_TEMP/split05-result-commit.txt"
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: split05-publication-evidence
          path: |
            ${{ runner.temp }}/split05-publish-audit.json
            ${{ runner.temp }}/split05-publish-diff.log
            ${{ runner.temp }}/split05-result-commit.txt
          retention-days: 30
