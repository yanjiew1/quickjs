name: ci

on:
  pull_request:
    paths:
      - '**'
      - '!.gitignore'
      - '!LICENSE'
      - '!TODO'
      - '!doc/**'
      - '!examples/**'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - '*'

jobs:
  unicode:
    name: Unicode table regeneration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install generator build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build
      - name: Download and verify Unicode inputs
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/tools/unicode_download.sh"
          cd unicode
          sha256sum --check "$GITHUB_WORKSPACE/tools/unicode-data.sha256"
      - name: Regenerate Unicode tables
        run: |
          meson setup build-unicode -Dwerror=true -Dunicode_data="$RUNNER_TEMP/unicode"
          meson compile -C build-unicode unicode-tables -j "$(getconf _NPROCESSORS_ONLN)"
      - name: Compare generated tables with the repository
        run: |
          status=0
          for file in libunicode-table.c libunicode-table.h; do
            diff -u "src/unicode/$file" "build-unicode/$file" || status=1
          done
          exit "$status"
      - name: Preserve generated tables on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unicode-generated-tables
          path: |
            build-unicode/libunicode-table.c
            build-unicode/libunicode-table.h

  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install Meson and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build
      - name: Build
        run: |
          meson setup build -Dwerror=true -Ddefault_library=both
          meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)"

      - name: Stats
        run: |
          ./build/qjs -qd
      - name: Run built-in tests
        run: |
          meson test -C build --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3

      - name: Run microbench
        run: |
          meson compile -C build microbench

      - name: Run test262
        run: |
          python3 tools/build/test262.py bootstrap
          python3 tools/build/test262.py run --runner build/run-test262 --threads "$(getconf _NPROCESSORS_ONLN)" --timing-log test262_timings.jsonl

      - name: Report Test262 timings
        if: always()
        run: |
          if test -f test262_timings.jsonl; then
            report_status=0
            python3 tools/ci/report_test262_timings.py test262_timings.jsonl \
              --csv test262_timings.csv --markdown test262_timings.md || report_status=$?
            cat test262_timings.md >> "$GITHUB_STEP_SUMMARY"
            exit "$report_status"
          fi
      - name: Preserve Test262 timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test262-timings-linux-${{ matrix.arch }}
          path: |
            test262_timings.jsonl
            test262_timings.csv
            test262_timings.md

  linux-lto:
    name: Linux LTO
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install Meson and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build
      - name: Build
        run: |
          meson setup build -Dwerror=true -Db_lto=true
          meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)"

      - name: Run built-in tests
        run: |
          meson test -C build --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3

      - name: Run microbench
        run: |
          meson compile -C build microbench

  linux-32bit:
    name: Linux 32bit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install gcc-multilib
        run: |
          sudo apt update
          sudo apt install -y gcc-multilib
      - name: Install Meson and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build
      - name: Build
        run: |
          CC='gcc -m32' meson setup build -Dwerror=true
          meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)"

      - name: Run built-in tests
        run: |
          meson test -C build --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3

      - name: Run test262
        run: |
          python3 tools/build/test262.py bootstrap
          python3 tools/build/test262.py run --runner build/run-test262 --threads "$(getconf _NPROCESSORS_ONLN)" --timing-log test262_timings.jsonl

      - name: Report Test262 timings
        if: always()
        run: |
          if test -f test262_timings.jsonl; then
            report_status=0
            python3 tools/ci/report_test262_timings.py test262_timings.jsonl \
              --csv test262_timings.csv --markdown test262_timings.md || report_status=$?
            cat test262_timings.md >> "$GITHUB_STEP_SUMMARY"
            exit "$report_status"
          fi
      - name: Preserve Test262 timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test262-timings-linux-32bit
          path: |
            test262_timings.jsonl
            test262_timings.csv
            test262_timings.md

  macos:
    name: macOS
    runs-on: macos-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - name: Install Meson and Ninja
        run: |
          brew install meson ninja
      - name: Build
        run: |
          meson setup build -Dwerror=true
          meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)"

      - name: Stats
        run: |
          ./build/qjs -qd
      - name: Run built-in tests
        run: |
          meson test -C build --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3

      - name: Run test262
        run: |
          python3 tools/build/test262.py bootstrap
          python3 tools/build/test262.py run --runner build/run-test262 --threads "$(getconf _NPROCESSORS_ONLN)" --timing-log test262_timings.jsonl

      - name: Report Test262 timings
        if: always()
        run: |
          if test -f test262_timings.jsonl; then
            report_status=0
            python3 tools/ci/report_test262_timings.py test262_timings.jsonl \
              --csv test262_timings.csv --markdown test262_timings.md || report_status=$?
            cat test262_timings.md >> "$GITHUB_STEP_SUMMARY"
            exit "$report_status"
          fi
      - name: Preserve Test262 timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test262-timings-macos
          path: |
            test262_timings.jsonl
            test262_timings.csv
            test262_timings.md

  mingw-windows:
    name: MinGW Windows target
    runs-on: ubuntu-latest
    env:
      WINEARCH: win64
      WINEDEBUG: "-all"
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install MinGW and Wine
        run: |
          sudo apt update
          sudo apt install -y wine64 mingw-w64 meson ninja-build
      - name: Setup Wine
        run: |
          # Set the prefix here, where runner shell variables are available.
          export WINEPREFIX="$RUNNER_TEMP/quickjs-wine64"
          printf 'WINEPREFIX=%s\n' "$WINEPREFIX" >> "$GITHUB_ENV"
          # Use the 64-bit loader directly; the wrapper warns about wine32.
          test -x /usr/lib/wine/wine64
          /usr/lib/wine/wine64 --version
          /usr/lib/wine/wine64 wineboot.exe --init
          # binfmt doesn't work in GitHub Actions
          #sudo apt install -y binfmt-support wine-binfmt
          #echo ":Wine:M::MZ::/usr/bin/wine:" > /etc/binfmt.d/wine.conf
          #sudo systemctl restart systemd-binfmt
      - name: Build
        run: |
          meson setup build --cross-file build-aux/cross/mingw64.ini --cross-file build-aux/cross/wine64.ini -Ddefault_library=shared
          meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)"
          cp /usr/x86_64-w64-mingw32/lib/libwinpthread-1.dll build/
          gcc_runtime=$(x86_64-w64-mingw32-gcc -print-file-name=libgcc_s_seh-1.dll)
          if test ! -f "$gcc_runtime"; then
            gcc_runtime=$(find /usr/lib/gcc/x86_64-w64-mingw32 /usr/x86_64-w64-mingw32 -name libgcc_s_seh-1.dll -print -quit)
          fi
          cp "$gcc_runtime" build/
          # Script drivers also run executables from source-free directories.
          wine_path=$(/usr/lib/wine/wine64 winepath.exe -w "$PWD/build")
          printf 'WINEPATH=%s\n' "$wine_path" >> "$GITHUB_ENV"

      - name: Run built-in tests
        run: |
          meson test -C build --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3

  windows-msys:
    name: Windows MSYS2
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git diffutils python mingw-w64-ucrt-x86_64-meson mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-dlfcn
      - name: Build
        run: |
          meson setup build -Dwerror=true -Ddefault_library=both
          meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)"

      - name: Stats
        run: |
          ./build/qjs -qd
      - name: Run built-in tests
        run: |
          meson test -C build --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3

      - name: Run microbench
        run: |
          meson compile -C build microbench

  linux-shared-install:
    name: Linux shared library installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config
      - name: Build and test the shared configuration
        run: |
          meson setup build --prefix "$RUNNER_TEMP/quickjs-install" -Dwerror=true -Ddefault_library=shared
          meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)"
          meson test -C build --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)"
      - name: Install and exercise public consumers
        run: |
          meson install -C build
          prefix="$RUNNER_TEMP/quickjs-install"
          "$prefix/bin/qjs" -e 'if (6 * 7 !== 42) throw Error("installed qjs");'
          python3 tests/test_qjsc_executable.py "$prefix/bin/qjsc" '' '' n y
          export PKG_CONFIG_PATH="$prefix/lib/x86_64-linux-gnu/pkgconfig:$prefix/lib64/pkgconfig:$prefix/lib/pkgconfig"
          libdir="$(pkg-config --variable=libdir quickjs)"
          cc tests/test_shared_api.c $(pkg-config --cflags --libs quickjs) \
            -Wl,-rpath,"$libdir/quickjs" -o "$RUNNER_TEMP/public-embedding"
          "$RUNNER_TEMP/public-embedding"
