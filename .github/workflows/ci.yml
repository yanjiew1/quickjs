name: ci

on:
  pull_request:
    paths:
    - '**'
    - '!.gitignore'
    - '!LICENSE'
    - '!TODO'
    - '!doc/**'
    - '!examples/**'
    - '.github/workflows/ci.yml'
  push:
    branches:
    - '*'

jobs:
  intl-source-data:
    name: Pinned native Intl source data
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v7
    - name: Verify offline acquisition contracts
      run: |
        python3 tests/test_intl_sources.py
    - name: Acquire and authenticate pinned CLDR data
      run: |
        timeout 180s python3 tools/intl/acquire.py \
          --cache "$RUNNER_TEMP/intl-cache"
    - name: Audit pinned XML documents and DTD attribute schema
      run: |
        timeout 120s python3 tools/intl/cldr_xml.py \
          --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
    - name: Audit pinned root collation elements
      run: |
        timeout 60s python3 tools/intl/collation_tables.py \
          --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
    - name: Audit locale inheritance graphs
      run: |
        timeout 60s python3 tools/intl/parents.py \
          --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
    - name: Audit resolved native list templates
      run: |
        timeout 120s python3 tools/intl/list_patterns.py \
          --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
    - name: Audit locale aliases and extension metadata
      run: |
        timeout 60s python3 tools/intl/locale_metadata.py \
          --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
    - name: Audit resolved numeric symbols
      run: |
        timeout 120s python3 tools/intl/number_symbols.py \
          --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
    - name: Audit plural rules and range records
      run: |
        timeout 60s python3 tools/intl/plural_rules.py \
          --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
    - name: Audit standard number patterns
      run: |
        timeout 120s python3 tools/intl/number_pattern_syntax.py \
          --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
    - name: Audit sparse compact number patterns
      run: |
        timeout 120s python3 tools/intl/compact_pattern_syntax.py \
          --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
    - name: Audit raw date and time pattern syntax
      run: |
        timeout 120s python3 tools/intl/date_pattern_syntax.py \
          --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
        timeout 120s python3 tools/intl/date_pattern_syntax.py \
          --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4" --combinations
    - name: Audit localized timezone-name sources
      run: |
        timeout 120s python3 tools/intl/timezone_names.py \
          --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
    - name: Audit supplemental timezone presentation
      run: |
        timeout 120s python3 tools/intl/timezone_presentation.py \
          --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
    - name: Audit supplemental day-period rules
      run: |
        timeout 120s python3 tools/intl/dayperiod_rules.py \
          --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
    - name: Audit currency names and fraction metadata
      run: |
        timeout 120s python3 tools/intl/currencies.py \
          --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
    - name: Audit inherited calendar date and time styles
      run: |
        timeout 120s python3 tools/intl/date_patterns.py \
          --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
    - name: Audit inherited date and time style connectors
      run: |
        timeout 120s python3 tools/intl/date_combinations.py \
          --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
    - name: Audit sparse calendar names and typed aliases
      run: |
        timeout 120s python3 tools/intl/calendar_names.py \
          --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
    - name: Audit sparse available date patterns and append templates
      run: |
        timeout 120s python3 tools/intl/date_available_formats.py \
          --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
    - name: Audit sparse interval patterns and source templates
      run: |
        timeout 120s python3 tools/intl/date_intervals.py \
          --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
    - name: Audit number range and currency layouts
      run: |
        timeout 120s python3 tools/intl/number_layout.py \
          --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
    - name: Audit unit names and grammatical patterns
      run: |
        timeout 180s python3 tools/intl/unit_patterns.py \
          --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
    - name: Reproduce prepared native and minimal Intl sections
      run: |
        for profile in minimal native; do
          timeout --kill-after=30s 600s python3 tools/intl/generate.py \
            --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4" \
            --profile "$profile" \
            --output "$RUNNER_TEMP/intl-$profile.bin" \
            --manifest "$RUNNER_TEMP/intl-$profile.json"
          cmp "data/intl/$profile.bin" "$RUNNER_TEMP/intl-$profile.bin"
          cmp "data/intl/$profile-manifest.json" "$RUNNER_TEMP/intl-$profile.json"
        done
  calendar-data:
    name: Native calendar data regeneration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7
    - name: Acquire original calendar source receipts
      run: |
        python3 tools/calendar/acquire.py --cache "$RUNNER_TEMP/calendar-sources" \
          --source ummalqura_data.rs --source icu4x-korea-data.rs \
          --source kabise.txt --source cldr-calendarData.xml
    - name: Reproduce factual JSON from authenticated source
      run: |
        python3 tools/calendar/import_icu4x.py --cache "$RUNNER_TEMP/calendar-sources" \
          --output-dir "$RUNNER_TEMP/calendar-facts"
        cmp data/calendar/islamic-umalqura.json "$RUNNER_TEMP/calendar-facts/islamic-umalqura.json"
        cmp data/calendar/icu4x-korea-data.json "$RUNNER_TEMP/calendar-facts/icu4x-korea-data.json"
    - name: Reproduce normalized calendar publications offline
      run: |
        python3 tests/test_calendar_generator.py
        python3 tools/calendar/normalize.py --cache "$RUNNER_TEMP/calendar-sources" --output-dir "$RUNNER_TEMP/calendar"
        cmp data/calendar/persian.json "$RUNNER_TEMP/calendar/persian.json"
        cmp data/calendar/japanese.json "$RUNNER_TEMP/calendar/japanese.json"
        python3 tools/calendar/generate.py --output "$RUNNER_TEMP/calendar-data.bin" --manifest "$RUNNER_TEMP/calendar-manifest.json"
        cmp data/calendar/calendar-data.bin "$RUNNER_TEMP/calendar-data.bin"
        cmp data/calendar/calendar-data-manifest.json "$RUNNER_TEMP/calendar-manifest.json"
  timezone-data:
    name: Native timezone data regeneration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - name: Acquire and verify released inputs
      run: |
        timeout 180s python3 tools/timezone/acquire.py \
          --cache "$RUNNER_TEMP/timezone-cache"
    - name: Regenerate the single binary pack
      run: |
        timeout 600s python3 tools/timezone/generate.py \
          --cache "$RUNNER_TEMP/timezone-cache" \
          --output "$RUNNER_TEMP/timezone-data.bin" \
          --manifest "$RUNNER_TEMP/timezone-data-manifest.json"
        cmp data/timezone/timezone-data.bin "$RUNNER_TEMP/timezone-data.bin"
        cmp data/timezone/timezone-data-manifest.json "$RUNNER_TEMP/timezone-data-manifest.json"
  unicode:
    name: Unicode table regeneration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - name: Install generator build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build
    - name: Download and verify Unicode inputs
      run: |
        cd "$RUNNER_TEMP"
        "$GITHUB_WORKSPACE/tools/unicode_download.sh"
        cd unicode
        sha256sum --check "$GITHUB_WORKSPACE/tools/unicode-data.sha256"
    - name: Configure unicode tools
      run: |
        meson setup build-unicode -Dwerror=true -Dunicode_data="$RUNNER_TEMP/unicode"
    - name: Compile unicode tools
      run: |
        meson compile -C build-unicode -j "$(getconf _NPROCESSORS_ONLN)" \
          unicode-tables \
          unicode_gen_test
    - name: Compare generated tables with the repository
      run: |
        status=0
        for file in libunicode-table.c libunicode-table.h; do
          diff -u "src/unicode/$file" "build-unicode/$file" || status=1
        done
        exit "$status"
    - name: Check Unicode normalization conformance
      run: |
        build-unicode/unicode_gen_test "$RUNNER_TEMP/unicode"
    - name: Preserve generated tables on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: unicode-generated-tables
        path: |
          build-unicode/libunicode-table.c
          build-unicode/libunicode-table.h

  temporal-configurations:
    name: Temporal ${{ matrix.profile }} configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
        - profile: minimal
          intl: disabled
          temporal: 'true'
          calendars: iso
          timezone: minimal
          policy: utc
          library: static
        - profile: host-offset
          intl: disabled
          temporal: 'true'
          calendars: native
          timezone: minimal
          policy: host-offset
          library: static
        - profile: disabled
          intl: disabled
          temporal: 'false'
          calendars: iso
          timezone: minimal
          policy: utc
          library: static
        - profile: iso-named
          intl: disabled
          temporal: 'true'
          calendars: iso
          timezone: native
          policy: utc
          library: shared
        - profile: intl-iso-minimal
          intl: native
          temporal: 'true'
          calendars: iso
          timezone: minimal
          policy: host-offset
          library: shared
        - profile: intl-native-minimal
          intl: minimal
          temporal: 'true'
          calendars: native
          timezone: minimal
          policy: utc
          library: static
    # Limited backend rows validate selected capabilities through repository tests.
    # Full native calendar/zone Test262 remains in the ordinary and sanitizer lanes.
    steps:
    - uses: actions/checkout@v7
    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build
    - name: Configure selected build
      id: configure
      run: |
        meson setup build -Dwerror=true -Ddocumentation=disabled \
          -Dintl=${{ matrix.intl }} -Dtemporal=${{ matrix.temporal }} \
          -Dcalendars=${{ matrix.calendars }} -Dtimezone_backend=${{ matrix.timezone }} \
          -Dsystem_timezone_policy=${{ matrix.policy }} -Ddefault_library=${{ matrix.library }}
    - name: Compile selected build
      id: compile
      run: |
        meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)" 2>&1 | tee build/compile.log
    - name: Run repository unit tests
      id: repo-unit
      if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      run: |
        meson test -C build --no-rebuild --suite unit --logbase repo-unit \
          --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3
    - name: Run repository integration tests
      id: repo-integration
      if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      run: |
        meson test -C build --no-rebuild --suite integration --logbase repo-integration \
          --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3
    - name: Record source and runner identity
      if: always()
      run: |
        git rev-parse HEAD > ci-identity.txt
        printf 'run=%s attempt=%s runner=%s arch=%s\n' \
          "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_OS" "$RUNNER_ARCH" >> ci-identity.txt
        uname -a >> ci-identity.txt
        meson --version >> ci-identity.txt
        python3 --version >> ci-identity.txt
        if test -d test262/.git; then
          printf 'test262=' >> ci-identity.txt
          git -C test262 rev-parse HEAD >> ci-identity.txt
        fi
        if test -f build/.ninja_log; then
          # Keep raw Ninja actions separately from compile_commands.json compiler entries.
          cp build/.ninja_log build/ninja-actions.log
        fi
    - name: Preserve configuration and test diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: native-capability-${{ matrix.profile }}
        path: |
          build/meson-info/intro-buildoptions.json
          build/meson-info/intro-tests.json
          build/meson-info/intro-targets.json
          build/compile_commands.json
          build/compile.log
          build/ninja-actions.log
          build/meson-logs/
          ci-identity.txt
        if-no-files-found: ignore
  linux:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CC: ${{ matrix.cc }}
      INTL_PROFILE: ${{ matrix.intl }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Linux (x86_64)
          id: linux-x86_64
          arch: x86_64
          runner: ubuntu-latest
          cc: gcc
          intl: disabled
          library: both
          microbench: true
        - name: Linux (arm64)
          id: linux-arm64
          arch: arm64
          runner: ubuntu-24.04-arm
          cc: gcc
          intl: minimal
          library: both
          microbench: true
        - name: Linux 32bit
          id: linux-32bit
          arch: x86
          runner: ubuntu-latest
          cc: gcc -m32
          intl: native
          library: static
          microbench: false
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Install Meson and Ninja
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build
    - name: Install 32-bit compiler support
      if: matrix.arch == 'x86'
      run: |
        sudo apt-get install -y gcc-multilib
    - name: Configure selected build
      id: configure
      run: |
        meson setup build -Dwerror=true -Ddefault_library=${{ matrix.library }} \
          -Dintl=${{ matrix.intl }} -Dtemporal=true -Dcalendars=native -Dtimezone_backend=native
    - name: Compile selected build
      id: compile
      run: |
        meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)" 2>&1 | tee build/compile.log
    - name: Stats
      if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      run: |
        ./build/qjs -qd
    - name: Run repository unit tests
      id: repo-unit
      if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      run: |
        meson test -C build --no-rebuild --suite unit --logbase repo-unit \
          --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3
    - name: Run repository integration tests
      id: repo-integration
      if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      run: |
        meson test -C build --no-rebuild --suite integration --logbase repo-integration \
          --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3
    - name: Run microbench
      if: ${{ !cancelled() && steps.compile.outcome == 'success' && matrix.microbench }}
      run: |
        meson compile -C build microbench
    - name: Bootstrap pinned Test262
      id: bootstrap-test262
      if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      timeout-minutes: 10
      run: |
        python3 tools/build/test262.py bootstrap
    - name: Run core Test262
      id: test262-core
      if: ${{ !cancelled() && steps.bootstrap-test262.outcome == 'success' }}
      timeout-minutes: 25
      run: |
        profile_config=()
        if test "${INTL_PROFILE:-disabled}" = minimal && test -f tests/intl-minimal-test262.conf; then
          profile_config=(-c tests/intl-minimal-test262.conf)
        fi
        if test "${INTL_PROFILE:-disabled}" != disabled && test -f tests/intl-partial-core-test262.conf; then
          profile_config+=(-c tests/intl-partial-core-test262.conf)
        fi
        python3 tools/build/test262.py run --runner build/run-test262 "${profile_config[@]}" \
          --threads "$(getconf _NPROCESSORS_ONLN)" \
          --timing-log test262_timings.jsonl --progress-log test262_progress.jsonl \
          2>&1 | tee test262_runtime.log
    - name: Run selected-profile Intl Test262
      id: test262-intl
      if: ${{ !cancelled() && steps.bootstrap-test262.outcome == 'success' && matrix.intl != 'disabled' }}
      timeout-minutes: 20
      run: |
        profile_config=()
        if test "$INTL_PROFILE" = minimal && test -f tests/intl-minimal-test262.conf; then
          profile_config=(-c tests/intl-minimal-test262.conf)
        fi
        build/run-test262 -T "$(getconf _NPROCESSORS_ONLN)" \
          -t -m -c tests/intl-locale-test262.conf "${profile_config[@]}" \
          --timing-log test262_intl_timings.jsonl --progress-log test262_intl_progress.jsonl \
          2>&1 | tee test262_intl_runtime.log
    - name: Report Test262 timings and core Temporal selection
      if: always()
      run: |
        report_status=0
        sh tools/ci/report_test262_summaries.sh test262 test262_intl || report_status=$?
        # This audit matches the core configuration's explicit non-Intl selection,
        # including when the same executable also supplies a separate Intl run.
        if test -f test262_timings.jsonl; then
          python3 tools/ci/audit_temporal_test262.py test262_timings.jsonl \
            --markdown test262_selection.md || report_status=$?
          cat test262_selection.md >> "$GITHUB_STEP_SUMMARY"
        fi
        exit "$report_status"
    - name: Record source and runner identity
      if: always()
      run: |
        sh tools/ci/record_identity.sh
    - name: Preserve configuration and test diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: native-${{ matrix.id }}
        path: |
          build/meson-info/intro-buildoptions.json
          build/meson-info/intro-tests.json
          build/meson-info/intro-targets.json
          build/compile_commands.json
          build/compile.log
          build/ninja-actions.log
          build/meson-logs/
          ci-identity.txt
          test262*timings.*
          test262*progress.jsonl
          test262*runtime.log
          test262_selection.md
        if-no-files-found: ignore
  linux-lto:
    name: Linux LTO (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CC: ${{ matrix.compiler }}
      CC_LD: ${{ matrix.linker }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: gcc-full
          compiler: gcc
          linker: bfd
          mode: default
        - name: clang-thin
          compiler: clang
          linker: lld
          mode: thin
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Install Meson and Ninja
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build clang lld
    - name: Configure selected build
      id: configure
      run: |
        # Bound link concurrency as well as each LTO backend's worker count.
        lto_options=()
        if [ "${{ matrix.mode }}" = thin ]; then
          # qjsc invokes the compiler itself, outside Meson's CC_LD handling.
          lto_options+=(-Db_lto_mode=thin -Db_thinlto_cache=true
            '-Dqjsc_cc=clang,-fuse-ld=lld')
        fi
        meson setup build -Dwerror=true -Ddefault_library=shared -Db_lto=true -Dintl=native \
          -Dbackend_max_links=2 -Db_lto_threads=2 "${lto_options[@]}" \
          -Dtemporal=true -Dcalendars=native -Dtimezone_backend=native
    - name: Compile selected build
      id: compile
      run: |
        meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)" 2>&1 | tee build/compile.log
    - name: Run repository unit tests
      id: repo-unit
      if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      run: |
        meson test -C build --no-rebuild --suite unit --logbase repo-unit \
          --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3
    - name: Run repository integration tests
      id: repo-integration
      if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      run: |
        meson test -C build --no-rebuild --suite integration --logbase repo-integration \
          --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3
    - name: Run microbench
      if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      run: |
        meson compile -C build microbench
    - name: Record source and runner identity
      if: always()
      run: |
        sh tools/ci/record_identity.sh
    - name: Preserve configuration and test diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: native-linux-lto-${{ matrix.name }}
        path: |
          build/meson-info/intro-buildoptions.json
          build/meson-info/intro-tests.json
          build/meson-info/intro-targets.json
          build/compile_commands.json
          build/compile.log
          build/ninja-actions.log
          build/meson-logs/
          ci-identity.txt
        if-no-files-found: ignore
  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      INTL_PROFILE: minimal
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v7
    - name: Install Meson and Ninja
      run: |
        brew install meson ninja
    - name: Configure selected build
      id: configure
      run: |
        meson setup build -Dwerror=true -Dintl=minimal -Dtemporal=true \
          -Dcalendars=native -Dtimezone_backend=native
    - name: Compile selected build
      id: compile
      run: |
        meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)" 2>&1 | tee build/compile.log
    - name: Stats
      if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      run: |
        ./build/qjs -qd
    - name: Run repository unit tests
      id: repo-unit
      if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      run: |
        meson test -C build --no-rebuild --suite unit --logbase repo-unit \
          --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3
    - name: Run repository integration tests
      id: repo-integration
      if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      run: |
        meson test -C build --no-rebuild --suite integration --logbase repo-integration \
          --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3
    - name: Bootstrap pinned Test262
      id: bootstrap-test262
      if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      timeout-minutes: 10
      run: |
        python3 tools/build/test262.py bootstrap
    - name: Run core Test262
      id: test262-core
      if: ${{ !cancelled() && steps.bootstrap-test262.outcome == 'success' }}
      timeout-minutes: 25
      run: |
        profile_config=()
        if test "${INTL_PROFILE:-disabled}" = minimal && test -f tests/intl-minimal-test262.conf; then
          profile_config=(-c tests/intl-minimal-test262.conf)
        fi
        if test "${INTL_PROFILE:-disabled}" != disabled && test -f tests/intl-partial-core-test262.conf; then
          profile_config+=(-c tests/intl-partial-core-test262.conf)
        fi
        python3 tools/build/test262.py run --runner build/run-test262 "${profile_config[@]}" \
          --threads "$(getconf _NPROCESSORS_ONLN)" \
          --timing-log test262_timings.jsonl --progress-log test262_progress.jsonl \
          2>&1 | tee test262_runtime.log
    - name: Run selected-profile Intl Test262
      id: test262-intl
      if: ${{ !cancelled() && steps.bootstrap-test262.outcome == 'success' }}
      timeout-minutes: 20
      run: |
        profile_config=()
        if test "$INTL_PROFILE" = minimal && test -f tests/intl-minimal-test262.conf; then
          profile_config=(-c tests/intl-minimal-test262.conf)
        fi
        build/run-test262 -T "$(getconf _NPROCESSORS_ONLN)" \
          -t -m -c tests/intl-locale-test262.conf "${profile_config[@]}" \
          --timing-log test262_intl_timings.jsonl --progress-log test262_intl_progress.jsonl \
          2>&1 | tee test262_intl_runtime.log
    - name: Report Test262 timings and core Temporal selection
      if: always()
      run: |
        report_status=0
        sh tools/ci/report_test262_summaries.sh test262 test262_intl || report_status=$?
        # This audit matches the core configuration's explicit non-Intl selection,
        # including when the same executable also supplies a separate Intl run.
        if test -f test262_timings.jsonl; then
          python3 tools/ci/audit_temporal_test262.py test262_timings.jsonl \
            --markdown test262_selection.md || report_status=$?
          cat test262_selection.md >> "$GITHUB_STEP_SUMMARY"
        fi
        exit "$report_status"
    - name: Record source and runner identity
      if: always()
      run: |
        sh tools/ci/record_identity.sh
    - name: Preserve configuration and test diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: native-macos
        path: |
          build/meson-info/intro-buildoptions.json
          build/meson-info/intro-tests.json
          build/meson-info/intro-targets.json
          build/compile_commands.json
          build/compile.log
          build/ninja-actions.log
          build/meson-logs/
          ci-identity.txt
          test262*timings.*
          test262*progress.jsonl
          test262*runtime.log
          test262_selection.md
        if-no-files-found: ignore
  mingw-windows:
    name: MinGW Windows target
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WINEARCH: win64
      WINEDEBUG: "-all"
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Install MinGW and Wine
        # Bound package-network stalls independently of the build/test budget.
      timeout-minutes: 15
      run: |
        # Use the canonical HTTPS archive for both direct apt sources and
        # mirror lists supplied by the runner image.
        for apt_source in /etc/apt/sources.list \
                          /etc/apt/sources.list.d/*.sources \
                          /etc/apt/sources.list.d/*.list \
                          /etc/apt/apt-mirrors*.txt; do
          if test -f "$apt_source"; then
            sudo sed -i \
              's|https\?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              "$apt_source"
          fi
        done

        sudo apt-get update -o Acquire::Retries=3
        # This target uses only 64-bit C with POSIX threads. Avoid the MinGW
        # metapackage's extra C++/32-bit toolchains and Wine recommendations.
        sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
          wine64 \
          gcc-mingw-w64-x86-64-posix \
          meson \
          ninja-build
    - name: Setup Wine
      timeout-minutes: 5
      run: |
        # Set the prefix here, where runner shell variables are available.
        export WINEPREFIX="$RUNNER_TEMP/quickjs-wine64"
        printf 'WINEPREFIX=%s\n' "$WINEPREFIX" >> "$GITHUB_ENV"
        # Use the 64-bit loader directly; the wrapper warns about wine32.
        test -x /usr/lib/wine/wine64
        /usr/lib/wine/wine64 --version
        /usr/lib/wine/wine64 wineboot.exe --init
        # binfmt doesn't work in GitHub Actions
        #sudo apt install -y binfmt-support wine-binfmt
        #echo ":Wine:M::MZ::/usr/bin/wine:" > /etc/binfmt.d/wine.conf
        #sudo systemctl restart systemd-binfmt
    - name: Configure selected build
      id: configure
      run: |
        meson setup build --cross-file build-aux/cross/mingw64.ini --cross-file build-aux/cross/wine64.ini -Ddefault_library=shared
    - name: Compile selected build
      id: compile
      run: |
        meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)" 2>&1 | tee build/compile.log
    - name: Prepare Windows runtime DLLs and loader path
      id: runtime
      run: |
        cp /usr/x86_64-w64-mingw32/lib/libwinpthread-1.dll build/
        gcc_runtime=$(x86_64-w64-mingw32-gcc -print-file-name=libgcc_s_seh-1.dll)
        if test ! -f "$gcc_runtime"; then
          gcc_runtime=$(find /usr/lib/gcc/x86_64-w64-mingw32 /usr/x86_64-w64-mingw32 -name libgcc_s_seh-1.dll -print -quit)
        fi
        cp "$gcc_runtime" build/
        # Script drivers also run executables from source-free directories.
        wine_path=$(/usr/lib/wine/wine64 winepath.exe -w "$PWD/build")
        printf 'WINEPATH=%s\n' "$wine_path" >> "$GITHUB_ENV"
    - name: Run repository unit tests
      id: repo-unit
      if: ${{ !cancelled() && steps.compile.outcome == 'success' && steps.runtime.outcome == 'success' }}
      run: |
        meson test -C build --no-rebuild --suite unit --logbase repo-unit \
          --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3
    - name: Run repository integration tests
      id: repo-integration
      if: ${{ !cancelled() && steps.compile.outcome == 'success' && steps.runtime.outcome == 'success' }}
      run: |
        meson test -C build --no-rebuild --suite integration --logbase repo-integration \
          --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3
    - name: Record source and runner identity
      if: always()
      run: |
        sh tools/ci/record_identity.sh
    - name: Preserve configuration and test diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: native-mingw-windows
        path: |
          build/meson-info/intro-buildoptions.json
          build/meson-info/intro-tests.json
          build/meson-info/intro-targets.json
          build/compile_commands.json
          build/compile.log
          build/ninja-actions.log
          build/meson-logs/
          ci-identity.txt
        if-no-files-found: ignore
  windows-msys:
    name: Windows MSYS2
    runs-on: windows-latest
    env:
      INTL_PROFILE: native
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v7
    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: git diffutils python mingw-w64-ucrt-x86_64-meson mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-dlfcn
    - name: Configure selected build
      id: configure
      run: |
        meson setup build -Dwerror=true -Ddefault_library=both -Dintl=native \
          -Dtemporal=true -Dcalendars=native -Dtimezone_backend=native
    - name: Compile selected build
      id: compile
      run: |
        set -o pipefail
        meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)" 2>&1 | tee build/compile.log
    - name: Stats
      if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      run: |
        ./build/qjs -qd
    - name: Run repository unit tests
      id: repo-unit
      if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      run: |
        meson test -C build --no-rebuild --suite unit --logbase repo-unit \
          --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3
    - name: Run repository integration tests
      id: repo-integration
      if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      run: |
        meson test -C build --no-rebuild --suite integration --logbase repo-integration \
          --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3
    - name: Run microbench
      if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      run: |
        meson compile -C build microbench
    - name: Record source and runner identity
      if: always()
      run: |
        sh tools/ci/record_identity.sh
    - name: Preserve configuration and test diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: native-windows-msys
        path: |
          build/meson-info/intro-buildoptions.json
          build/meson-info/intro-tests.json
          build/meson-info/intro-targets.json
          build/compile_commands.json
          build/compile.log
          build/ninja-actions.log
          build/meson-logs/
          ci-identity.txt
        if-no-files-found: ignore
  linux-shared-install:
    name: Linux shared library installation
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7
    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build pkg-config
    - name: Configure selected build
      id: configure
      run: |
        meson setup build --prefix "$RUNNER_TEMP/quickjs-install" \
          -Dwerror=true -Ddefault_library=shared -Dintl=disabled -Dtemporal=true
    - name: Compile selected build
      id: compile
      run: |
        meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)" 2>&1 | tee build/compile.log
    - name: Run repository unit tests
      id: repo-unit
      if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      run: |
        meson test -C build --no-rebuild --suite unit --logbase repo-unit \
          --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3
    - name: Run repository integration tests
      id: repo-integration
      if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      run: |
        meson test -C build --no-rebuild --suite integration --logbase repo-integration \
          --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3
    - name: Install and exercise public consumers
      if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      run: |
        meson install -C build
        prefix="$RUNNER_TEMP/quickjs-install"
        "$prefix/bin/qjs" -e 'if (6 * 7 !== 42) throw Error("installed qjs");'
        python3 tests/test_qjsc_executable.py "$prefix/bin/qjsc" '' n y '' libquickjs.so
        export PKG_CONFIG_PATH="$prefix/lib/x86_64-linux-gnu/pkgconfig:$prefix/lib64/pkgconfig:$prefix/lib/pkgconfig"
        libdir="$(pkg-config --variable=libdir quickjs)"
        cc tests/test_shared_api.c $(pkg-config --cflags --libs quickjs) \
          -Wl,-rpath,"$libdir/quickjs" -o "$RUNNER_TEMP/public-embedding"
        "$RUNNER_TEMP/public-embedding"
    - name: Record source and runner identity
      if: always()
      run: |
        sh tools/ci/record_identity.sh
    - name: Preserve configuration and test diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: native-linux-shared-install
        path: |
          build/meson-info/intro-buildoptions.json
          build/meson-info/intro-tests.json
          build/meson-info/intro-targets.json
          build/compile_commands.json
          build/compile.log
          build/ninja-actions.log
          build/meson-logs/
          ci-identity.txt
        if-no-files-found: ignore
  value-check:
    name: JSValue compile diagnostic (${{ matrix.id }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
        - id: core-off
          intl: disabled
          temporal: 'false'
        - id: temporal-native
          intl: disabled
          temporal: 'true'
        - id: intl-native-temporal
          intl: native
          temporal: 'true'
    steps:
    - uses: actions/checkout@v7
    - name: Install diagnostic compiler and build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc meson ninja-build
    - name: Configure selected build
      id: configure
      run: |
        CC=gcc meson setup build -Dwerror=true -Ddocumentation=disabled \
          -Dtests=false -Dexamples=false -Dcheck_jsvalue=true \
          -Dintl=${{ matrix.intl }} -Dtemporal=${{ matrix.temporal }} \
          -Dcalendars=native -Dtimezone_backend=native
    - name: Compile selected build
      id: compile
      run: |
        meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)" quickjs-value-check 2>&1 | tee build/compile.log
    - name: Record source and runner identity
      if: always()
      run: |
        sh tools/ci/record_identity.sh
    - name: Preserve configuration and test diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: native-value-check-${{ matrix.id }}
        path: |
          build/meson-info/intro-buildoptions.json
          build/meson-info/intro-tests.json
          build/meson-info/intro-targets.json
          build/compile_commands.json
          build/compile.log
          build/ninja-actions.log
          build/meson-logs/
          ci-identity.txt
        if-no-files-found: ignore
  fuzz-smoke:
    name: Clang libFuzzer build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CC: clang
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7
    - name: Install Clang and build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y clang meson ninja-build
    - name: Configure selected build
      id: configure
      run: |
        meson setup build -Dwerror=true -Ddocumentation=disabled \
          -Dtests=false -Dexamples=false -Dfuzzing=true -Db_sanitize=address,undefined \
          -Dintl=native -Dtemporal=true -Dcalendars=native -Dtimezone_backend=native
    - name: Compile selected build
      id: compile
      run: |
        meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)" fuzz_eval fuzz_compile fuzz_regexp 2>&1 | tee build/compile.log
    - name: Run bounded fuzzer smoke tests
      if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      run: |
        mkdir -p build/fuzz-corpus/js build/fuzz-corpus/regexp
        printf '%s\n' 'let x = 6 * 7; Promise.resolve(x);' > build/fuzz-corpus/js/core.js
        printf '%s\n' 'new Intl.DateTimeFormat("en").format(0); Temporal.Now.instant();' > build/fuzz-corpus/js/intl.js
        printf 'a+\0aaa' > build/fuzz-corpus/regexp/basic
        for target in eval compile; do
          timeout --kill-after=10s 30s "build/tools/build/fuzz_$target" \
            -runs=100 -max_total_time=15 -timeout=5 -rss_limit_mb=1024 -max_len=4096 "build/fuzz-corpus/js" \
            2>&1 | tee "build/fuzz-$target.log"
        done
        timeout --kill-after=10s 30s build/tools/build/fuzz_regexp \
          -runs=100 -max_total_time=15 -timeout=5 -rss_limit_mb=1024 -max_len=4096 build/fuzz-corpus/regexp \
          2>&1 | tee build/fuzz-regexp.log
    - name: Record source and runner identity
      if: always()
      run: |
        sh tools/ci/record_identity.sh
    - name: Preserve configuration and test diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: native-fuzz-smoke
        path: |
          build/meson-info/intro-buildoptions.json
          build/meson-info/intro-tests.json
          build/meson-info/intro-targets.json
          build/compile_commands.json
          build/compile.log
          build/ninja-actions.log
          build/meson-logs/
          ci-identity.txt
          build/fuzz-*.log
          crash-*
          timeout-*
        if-no-files-found: ignore
