name: ci

on:
  pull_request:
    paths:
      - '**'
      - '!.gitignore'
      - '!LICENSE'
      - '!TODO'
      - '!doc/**'
      - '!examples/**'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - '*'

jobs:
  linux:
    name: Linux (Ubuntu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build
        run: |
          make -j$(getconf _NPROCESSORS_ONLN) CONFIG_WERROR=y
      - name: Stats
        run: |
          ./qjs -qd
      - name: Run built-in tests
        run: |
          make test
      - name: Run microbench
        run: |
          make microbench
      - name: Run test262
        run: |
          make test2-bootstrap
          make test2

  linux-lto:
    name: Linux LTO
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build
        run: |
          make -j$(getconf _NPROCESSORS_ONLN) CONFIG_WERROR=y CONFIG_LTO=y
      - name: Run built-in tests
        run: |
          make test
      - name: Run microbench
        run: |
          make microbench

  linux-32bit:
    name: Linux 32bit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install gcc-multilib
        run: |
          sudo apt update
          sudo apt install -y gcc-multilib
      - name: Build
        run: |
          make -j$(getconf _NPROCESSORS_ONLN) CONFIG_WERROR=y CONFIG_M32=y
      - name: Run built-in tests
        run: |
          make CONFIG_M32=y test
      - name: Run test262
        run: |
          make test2-bootstrap
          make CONFIG_M32=y test2

  linux-sanitizers:
    name: Linux ${{ matrix.compiler }} ${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        sanitizer: [ASan, UBSan]
    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      COMPILER: ${{ matrix.compiler }}
      USE_CLANG: ${{ matrix.compiler == 'clang' && 'y' || '' }}
      USE_ASAN: ${{ matrix.sanitizer == 'ASan' && 'y' || '' }}
      USE_UBSAN: ${{ matrix.sanitizer == 'UBSan' && 'y' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build
        run: |
          make -j$(getconf _NPROCESSORS_ONLN) CONFIG_WERROR=y CONFIG_LTO= \
            CC="$COMPILER" HOST_CC="$COMPILER" CONFIG_CLANG="$USE_CLANG" \
            CONFIG_ASAN="$USE_ASAN" CONFIG_UBSAN="$USE_UBSAN"
      - name: Run built-in tests
        run: |
          make CONFIG_WERROR=y CONFIG_LTO= \
            CC="$COMPILER" HOST_CC="$COMPILER" CONFIG_CLANG="$USE_CLANG" \
            CONFIG_ASAN="$USE_ASAN" CONFIG_UBSAN="$USE_UBSAN" test
      - name: Install pinned Test262
        run: make test2-bootstrap
      - name: Run Test262
        run: |
          ./run-test262 -T 2 -t -m -c test262.conf -a
      - name: Preserve Test262 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test262-${{ matrix.compiler }}-${{ matrix.sanitizer }}
          path: |
            test262_report.txt
            test262_errors.txt

  linux-msan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build
        env:
          CC: clang
        run: |
          make -j$(getconf _NPROCESSORS_ONLN) CONFIG_WERROR=y CONFIG_MSAN=y CONFIG_CLANG=y
      - name: Run built-in tests
        env:
          MSAN_OPTIONS: halt_on_error=1
        run: |
          make CONFIG_MSAN=y CONFIG_CLANG=y test

  macos:
    name: macOS
    runs-on: macos-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          make -j$(getconf _NPROCESSORS_ONLN) CONFIG_WERROR=y
      - name: Stats
        run: |
          ./qjs -qd
      - name: Run built-in tests
        run: |
          make test
      - name: Run test262
        run: |
          make test2-bootstrap
          make test2

  macos-asan:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          make -j$(getconf _NPROCESSORS_ONLN) CONFIG_WERROR=y CONFIG_ASAN=y
      - name: Run built-in tests
        env:
          ASAN_OPTIONS: halt_on_error=1
        run: |
          make CONFIG_ASAN=y test

  macos-ubsan:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          make -j$(getconf _NPROCESSORS_ONLN) CONFIG_WERROR=y CONFIG_UBSAN=y
      - name: Run built-in tests
        env:
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          make CONFIG_UBSAN=y test

  cosmopolitan:
    name: Cosmopolitan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Cosmopolitan
        run: |
          mkdir ~/cosmocc
          cd ~/cosmocc
          wget https://cosmo.zip/pub/cosmocc/cosmocc.zip
          unzip cosmocc.zip
          echo "$HOME/cosmocc/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          make CONFIG_COSMO=y
      - name: Run built-in tests
        run: |
          make CONFIG_COSMO=y test
      - name: Run test262
        run: |
          make test2-bootstrap
          make CONFIG_COSMO=y test2

  mingw-windows:
    name: MinGW Windows target
    runs-on: ubuntu-latest
    env:
      WINEARCH: win64
      WINEDEBUG: "-all"
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install MinGW and Wine
        run: |
          sudo apt update
          sudo apt install -y wine64 mingw-w64
          cp /usr/x86_64-w64-mingw32/lib/libwinpthread-1.dll .
          cp /usr/x86_64-w64-mingw32/lib/libwinpthread-1.dll tests/
      - name: Setup Wine
        run: |
          # Set the prefix here, where runner shell variables are available.
          export WINEPREFIX="$RUNNER_TEMP/quickjs-wine64"
          printf 'WINEPREFIX=%s\n' "$WINEPREFIX" >> "$GITHUB_ENV"
          # Use the 64-bit loader directly; the wrapper warns about wine32.
          test -x /usr/lib/wine/wine64
          /usr/lib/wine/wine64 --version
          /usr/lib/wine/wine64 wineboot.exe --init
          # binfmt doesn't work in GitHub Actions
          #sudo apt install -y binfmt-support wine-binfmt
          #echo ":Wine:M::MZ::/usr/bin/wine:" > /etc/binfmt.d/wine.conf
          #sudo systemctl restart systemd-binfmt
      - name: Build
        run: |
          make CONFIG_WIN32=y
      - name: Run built-in tests
        run: |
          # If binfmt support worked, could just run `make CONFIG_WIN32=y test`
          make WINE=/usr/lib/wine/wine64 CONFIG_WIN32=y test

  windows-msys:
    name: Windows MSYS2
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git make diffutils python mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-dlfcn
      - name: Build
        run: |
           make -j$(getconf _NPROCESSORS_ONLN) CONFIG_WERROR=y
      - name: Stats
        run: |
          ./qjs -qd
      - name: Run built-in tests
        run: |
          make test
      - name: Run microbench
        run: |
          make microbench
