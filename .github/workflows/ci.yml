name: split-05 correctness workspace

on:
  push:
    branches: [split-05]
    paths: ['.github/workflows/ci.yml']

permissions:
  contents: read

jobs:
  source-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare pinned source inputs
        run: |
          mkdir -p split05-inputs
          git archive --format=tar --prefix=main/ b63ab025d402e46c647a8a239bffe72a58f73a35 > split05-inputs/main.tar
          git archive --format=tar --prefix=upstream/ 04be246001599f5995fa2f2d8c91a0f198d3f34c > split05-inputs/upstream.tar
          sha256sum split05-inputs/*.tar > split05-inputs/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: split05-source-inputs
          path: split05-inputs/
          retention-days: 3
