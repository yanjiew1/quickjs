name: ci

on:
  pull_request:
    paths:
      - '**'
      - '!.gitignore'
      - '!LICENSE'
      - '!TODO'
      - '!doc/**'
      - '!examples/**'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - '*'

jobs:
  intl-source-data:
    name: Pinned native Intl source data
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Verify offline acquisition contracts
        run: python3 tests/test_intl_sources.py
      - name: Acquire and authenticate pinned CLDR data
        run: |
          timeout 180s python3 tools/intl/acquire.py \
            --cache "$RUNNER_TEMP/intl-cache"
      - name: Compare the complete pinned root collation ordering
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build
          meson setup build-collation -Dwerror=true -Ddocumentation=disabled
          meson compile -C build-collation -j2 test_intl_collation_minimal intl-collation-compile
          timeout --kill-after=15s 180s build-collation/tests/test_intl_collation_minimal \
            --ordered "$RUNNER_TEMP/intl-cache/cldr-49-beta4/common/uca/CollationTest_CLDR_NON_IGNORABLE.txt"
          timeout --kill-after=15s 180s build-collation/tests/test_intl_collation_minimal \
            --ordered-shifted "$RUNNER_TEMP/intl-cache/cldr-49-beta4/common/uca/CollationTest_CLDR_SHIFTED.txt"
      - name: Prepare exact collation targets for each profile
        run: |
          for profile in minimal native; do
            timeout --kill-after=15s 240s python3 tools/intl/collation_prepare.py \
              --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4" \
              --profile "$profile" --compiler build-collation/intl-collation-compile \
              --output "$RUNNER_TEMP/collation-$profile.qjcl"
          done
      - name: Audit pinned XML documents and DTD attribute schema
        run: |
          timeout 120s python3 tools/intl/cldr_xml.py \
            --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
      - name: Audit pinned root collation elements
        run: |
          timeout 60s python3 tools/intl/collation_tables.py \
            --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
      - name: Audit collation programs, inheritance and ordered imports
        run: |
          timeout 90s python3 tools/intl/collation_programs.py \
            --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
          timeout 90s python3 tools/intl/collation_bindings.py \
            --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4" --profile native
          timeout 90s python3 tools/intl/collation_bindings.py \
            --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4" --profile minimal
      - name: Audit root collation group identities and anchor keys
        run: |
          timeout 60s python3 tools/intl/collation_groups.py \
            --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
      - name: Audit logical fractional collation root data
        run: |
          timeout 60s python3 tools/intl/collation_fractional.py \
            --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
          timeout 60s python3 tools/intl/collation_ordinals.py \
            --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
          timeout 60s python3 tools/intl/collation_root_input.py \
            --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4" \
            --output "$RUNNER_TEMP/collation-root.qjcr"
      - name: Compile and verify collation programs with pinned Unicode
        run: |
          meson compile -C build-collation -j2 intl-collation-compile test_intl_collation_compiled
          timeout 60s build-collation/intl-collation-compile \
            --audit-root "$RUNNER_TEMP/collation-root.qjcr"
          timeout 90s python3 tools/intl/collation_ir.py \
            --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4" \
            --output "$RUNNER_TEMP/collation-input.qjci"
          timeout 60s build-collation/intl-collation-compile \
            --audit-pair "$RUNNER_TEMP/collation-root.qjcr" "$RUNNER_TEMP/collation-input.qjci"
          timeout 120s build-collation/intl-collation-compile \
            --execute-pair "$RUNNER_TEMP/collation-root.qjcr" "$RUNNER_TEMP/collation-input.qjci"
          timeout 180s python3 tools/intl/collation_archive.py \
            --compiler build-collation/intl-collation-compile \
            --root-input "$RUNNER_TEMP/collation-root.qjcr" \
            --program-input "$RUNNER_TEMP/collation-input.qjci" \
            --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4" --profile native \
            --output "$RUNNER_TEMP/collation-runtime.qjcl"
          timeout 60s build-collation/intl-collation-compile \
            --audit-compiled "$RUNNER_TEMP/collation-runtime.qjcl"
          timeout --kill-after=15s 180s build-collation/tests/test_intl_collation_compiled \
            --archive "$RUNNER_TEMP/collation-runtime.qjcl" \
            --ordered "$RUNNER_TEMP/intl-cache/cldr-49-beta4/common/uca/CollationTest_CLDR_NON_IGNORABLE.txt"
          timeout --kill-after=15s 180s build-collation/tests/test_intl_collation_compiled \
            --archive "$RUNNER_TEMP/collation-runtime.qjcl" \
            --ordered-shifted "$RUNNER_TEMP/intl-cache/cldr-49-beta4/common/uca/CollationTest_CLDR_SHIFTED.txt"
      - name: Audit locale inheritance graphs
        run: |
          timeout 60s python3 tools/intl/parents.py \
            --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
      - name: Audit resolved native list templates
        run: |
          timeout 120s python3 tools/intl/list_patterns.py \
            --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
      - name: Audit locale aliases and extension metadata
        run: |
          timeout 60s python3 tools/intl/locale_metadata.py \
            --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
      - name: Audit resolved numeric symbols
        run: |
          timeout 120s python3 tools/intl/number_symbols.py \
            --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
      - name: Audit plural rules and range records
        run: |
          timeout 60s python3 tools/intl/plural_rules.py \
            --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
      - name: Audit standard number patterns
        run: |
          timeout 120s python3 tools/intl/number_pattern_syntax.py \
            --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
      - name: Audit sparse compact number patterns
        run: |
          timeout 120s python3 tools/intl/compact_pattern_syntax.py \
            --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
      - name: Audit raw date and time pattern syntax
        run: |
          timeout 120s python3 tools/intl/date_pattern_syntax.py \
            --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
          timeout 120s python3 tools/intl/date_pattern_syntax.py \
            --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4" --combinations
      - name: Audit localized timezone-name sources
        run: |
          timeout 120s python3 tools/intl/timezone_names.py \
            --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
      - name: Audit supplemental timezone presentation
        run: |
          timeout 120s python3 tools/intl/timezone_presentation.py \
            --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
      - name: Audit supplemental day-period rules
        run: |
          timeout 120s python3 tools/intl/dayperiod_rules.py \
            --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
      - name: Audit currency names and fraction metadata
        run: |
          timeout 120s python3 tools/intl/currencies.py \
            --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
      - name: Audit inherited calendar date and time styles
        run: |
          timeout 120s python3 tools/intl/date_patterns.py \
            --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
      - name: Audit inherited date and time style connectors
        run: |
          timeout 120s python3 tools/intl/date_combinations.py \
            --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
      - name: Audit sparse calendar names and typed aliases
        run: |
          timeout 120s python3 tools/intl/calendar_names.py \
            --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
      - name: Audit sparse available date patterns and append templates
        run: |
          timeout 120s python3 tools/intl/date_available_formats.py \
            --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
      - name: Audit sparse interval patterns and source templates
        run: |
          timeout 120s python3 tools/intl/date_intervals.py \
            --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
      - name: Audit number range and currency layouts
        run: |
          timeout 120s python3 tools/intl/number_layout.py \
            --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
      - name: Audit unit names and grammatical patterns
        run: |
          timeout 180s python3 tools/intl/unit_patterns.py \
            --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4"
      - name: Reproduce prepared native and minimal Intl sections
        run: |
          for profile in minimal native; do
            timeout --kill-after=30s 600s python3 tools/intl/generate.py \
              --sources "$RUNNER_TEMP/intl-cache/cldr-49-beta4" \
              --profile "$profile" \
              --compiled-collation "$RUNNER_TEMP/collation-$profile.qjcl" \
              --output "$RUNNER_TEMP/intl-$profile.bin" \
              --manifest "$RUNNER_TEMP/intl-$profile.json"
            cmp "data/intl/$profile.bin" "$RUNNER_TEMP/intl-$profile.bin"
            cmp "data/intl/$profile-manifest.json" "$RUNNER_TEMP/intl-$profile.json"
          done
  temporal-configurations:
    name: Temporal ${{ matrix.profile }} configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [minimal, host-offset, disabled]
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build
      - name: Build and run repository tests
        run: |
          enabled=true
          backend=minimal
          calendars=native
          policy=utc
          if test '${{ matrix.profile }}' = minimal; then calendars=iso; fi
          if test '${{ matrix.profile }}' = disabled; then enabled=false; backend=native; fi
          if test '${{ matrix.profile }}' = host-offset; then policy=host-offset; fi
          meson setup build -Dwerror=true -Dtemporal="$enabled" \
            -Dcalendars="$calendars" \
            -Dtimezone_backend="$backend" -Dsystem_timezone_policy="$policy"
          meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)"
          meson test -C build --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)"
  calendar-data:
    name: Native calendar data regeneration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Reproduce normalized calendar publications offline
        run: |
          python3 tests/test_calendar_generator.py
          python3 tools/calendar/normalize.py --output-dir "$RUNNER_TEMP/calendar"
          cmp data/calendar/persian.json "$RUNNER_TEMP/calendar/persian.json"
          cmp data/calendar/islamic-umalqura.json "$RUNNER_TEMP/calendar/islamic-umalqura.json"
          cmp data/calendar/japanese.json "$RUNNER_TEMP/calendar/japanese.json"
          python3 tools/calendar/generate.py --output "$RUNNER_TEMP/calendar-data.bin" --manifest "$RUNNER_TEMP/calendar-manifest.json"
          cmp data/calendar/calendar-data.bin "$RUNNER_TEMP/calendar-data.bin"
          cmp data/calendar/calendar-data-manifest.json "$RUNNER_TEMP/calendar-manifest.json"
  timezone-data:
    name: Native timezone data regeneration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Acquire and verify released inputs
        run: |
          timeout 180s python3 tools/timezone/acquire.py \
            --cache "$RUNNER_TEMP/timezone-cache"
      - name: Regenerate the single binary pack
        run: |
          timeout 600s python3 tools/timezone/generate.py \
            --cache "$RUNNER_TEMP/timezone-cache" \
            --output "$RUNNER_TEMP/timezone-data.bin" \
            --manifest "$RUNNER_TEMP/timezone-data-manifest.json"
          cmp data/timezone/timezone-data.bin "$RUNNER_TEMP/timezone-data.bin"
          cmp data/timezone/timezone-data-manifest.json "$RUNNER_TEMP/timezone-data-manifest.json"
  unicode:
    name: Unicode table regeneration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install generator build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build
      - name: Download and verify Unicode inputs
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/tools/unicode_download.sh"
          cd unicode
          sha256sum --check "$GITHUB_WORKSPACE/tools/unicode-data.sha256"
      - name: Regenerate Unicode tables
        run: |
          meson setup build-unicode -Dwerror=true -Dunicode_data="$RUNNER_TEMP/unicode"
          meson compile -C build-unicode unicode-tables -j "$(getconf _NPROCESSORS_ONLN)"
      - name: Check compiled boundary properties against every Unicode code point
        run: |
          meson compile -C build-unicode test_unicode_break_properties -j "$(getconf _NPROCESSORS_ONLN)"
          build-unicode/tests/test_unicode_break_properties "$RUNNER_TEMP/unicode"
      - name: Check Unicode grapheme boundary conformance
        run: |
          meson compile -C build-unicode test_unicode_grapheme -j "$(getconf _NPROCESSORS_ONLN)"
          build-unicode/tests/test_unicode_grapheme "$RUNNER_TEMP/unicode/auxiliary/GraphemeBreakTest.txt"
      - name: Check Unicode word boundary conformance
        run: |
          meson compile -C build-unicode test_unicode_word -j "$(getconf _NPROCESSORS_ONLN)"
          build-unicode/tests/test_unicode_word "$RUNNER_TEMP/unicode/auxiliary/WordBreakTest.txt"
      - name: Check Unicode sentence boundary conformance
        run: |
          meson compile -C build-unicode test_unicode_sentence -j "$(getconf _NPROCESSORS_ONLN)"
          build-unicode/tests/test_unicode_sentence "$RUNNER_TEMP/unicode/auxiliary/SentenceBreakTest.txt"
      - name: Compare generated tables with the repository
        run: |
          status=0
          for file in libunicode-table.c libunicode-table.h; do
            diff -u "src/unicode/$file" "build-unicode/$file" || status=1
          done
          exit "$status"
      - name: Check Unicode normalization conformance
        run: |
          meson compile -C build-unicode unicode_gen_test -j "$(getconf _NPROCESSORS_ONLN)"
          build-unicode/unicode_gen_test "$RUNNER_TEMP/unicode"
      - name: Check NFC boundaries and NFD quick checks against source properties
        run: |
          meson compile -C build-unicode test_unicode_normalization_boundary -j "$(getconf _NPROCESSORS_ONLN)"
          build-unicode/tests/test_unicode_normalization_boundary "$RUNNER_TEMP/unicode"
      - name: Check indexed category predicates against full Unicode ranges
        run: |
          meson compile -C build-unicode test_unicode -j "$(getconf _NPROCESSORS_ONLN)"
          build-unicode/tests/test_unicode --all-categories
          build-unicode/tests/test_unicode --blocks "$RUNNER_TEMP/unicode/Blocks.txt"
          build-unicode/tests/test_unicode --decimal "$RUNNER_TEMP/unicode/UnicodeData.txt"
      - name: Preserve generated tables on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unicode-generated-tables
          path: |
            build-unicode/libunicode-table.c
            build-unicode/libunicode-table.h

  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install Meson and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build
      - name: Build
        run: |
          meson setup build -Dwerror=true -Ddefault_library=both
          meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)"

      - name: Stats
        run: |
          ./build/qjs -qd
      - name: Run built-in tests
        run: |
          meson test -C build --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3

      - name: Run microbench
        run: |
          meson compile -C build microbench

      - name: Run test262
        run: |
          python3 tools/build/test262.py bootstrap
          python3 tools/build/test262.py run --runner build/run-test262 --threads "$(getconf _NPROCESSORS_ONLN)" --timing-log test262_timings.jsonl

      - name: Report Test262 timings
        if: always()
        run: |
          if test -f test262_timings.jsonl; then
            report_status=0
            python3 tools/ci/report_test262_timings.py test262_timings.jsonl \
              --csv test262_timings.csv --markdown test262_timings.md || report_status=$?
            cat test262_timings.md >> "$GITHUB_STEP_SUMMARY"
            python3 tools/ci/audit_temporal_test262.py test262_timings.jsonl \
              --markdown test262_selection.md || report_status=$?
            cat test262_selection.md >> "$GITHUB_STEP_SUMMARY"
            exit "$report_status"
          fi
      - name: Preserve Test262 timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test262-timings-linux-${{ matrix.arch }}
          path: |
            test262_timings.jsonl
            test262_timings.csv
            test262_timings.md
            test262_selection.md

  linux-lto:
    name: Linux LTO
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install Meson and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build
      - name: Build
        run: |
          meson setup build -Dwerror=true -Db_lto=true
          meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)"

      - name: Run built-in tests
        run: |
          meson test -C build --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3

      - name: Run microbench
        run: |
          meson compile -C build microbench

  linux-32bit:
    name: Linux 32bit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install gcc-multilib
        run: |
          sudo apt update
          sudo apt install -y gcc-multilib
      - name: Install Meson and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build
      - name: Build
        run: |
          CC='gcc -m32' meson setup build -Dwerror=true
          meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)"

      - name: Run built-in tests
        run: |
          meson test -C build --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3

      - name: Run test262
        run: |
          python3 tools/build/test262.py bootstrap
          python3 tools/build/test262.py run --runner build/run-test262 --threads "$(getconf _NPROCESSORS_ONLN)" --timing-log test262_timings.jsonl

      - name: Report Test262 timings
        if: always()
        run: |
          if test -f test262_timings.jsonl; then
            report_status=0
            python3 tools/ci/report_test262_timings.py test262_timings.jsonl \
              --csv test262_timings.csv --markdown test262_timings.md || report_status=$?
            cat test262_timings.md >> "$GITHUB_STEP_SUMMARY"
            python3 tools/ci/audit_temporal_test262.py test262_timings.jsonl \
              --markdown test262_selection.md || report_status=$?
            cat test262_selection.md >> "$GITHUB_STEP_SUMMARY"
            exit "$report_status"
          fi
      - name: Preserve Test262 timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test262-timings-linux-32bit
          path: |
            test262_timings.jsonl
            test262_timings.csv
            test262_timings.md
            test262_selection.md

  macos:
    name: macOS
    runs-on: macos-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - name: Install Meson and Ninja
        run: |
          brew install meson ninja
      - name: Build
        run: |
          meson setup build -Dwerror=true
          meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)"

      - name: Stats
        run: |
          ./build/qjs -qd
      - name: Run built-in tests
        run: |
          meson test -C build --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3

      - name: Run test262
        run: |
          python3 tools/build/test262.py bootstrap
          python3 tools/build/test262.py run --runner build/run-test262 --threads "$(getconf _NPROCESSORS_ONLN)" --timing-log test262_timings.jsonl

      - name: Report Test262 timings
        if: always()
        run: |
          if test -f test262_timings.jsonl; then
            report_status=0
            python3 tools/ci/report_test262_timings.py test262_timings.jsonl \
              --csv test262_timings.csv --markdown test262_timings.md || report_status=$?
            cat test262_timings.md >> "$GITHUB_STEP_SUMMARY"
            python3 tools/ci/audit_temporal_test262.py test262_timings.jsonl \
              --markdown test262_selection.md || report_status=$?
            cat test262_selection.md >> "$GITHUB_STEP_SUMMARY"
            exit "$report_status"
          fi
      - name: Preserve Test262 timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test262-timings-macos
          path: |
            test262_timings.jsonl
            test262_timings.csv
            test262_timings.md
            test262_selection.md

  mingw-windows:
    name: MinGW Windows target
    runs-on: ubuntu-latest
    env:
      WINEARCH: win64
      WINEDEBUG: "-all"
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install MinGW and Wine
        run: |
          sudo apt update
          sudo apt install -y wine64 mingw-w64 meson ninja-build
      - name: Setup Wine
        run: |
          # Set the prefix here, where runner shell variables are available.
          export WINEPREFIX="$RUNNER_TEMP/quickjs-wine64"
          printf 'WINEPREFIX=%s\n' "$WINEPREFIX" >> "$GITHUB_ENV"
          # Use the 64-bit loader directly; the wrapper warns about wine32.
          test -x /usr/lib/wine/wine64
          /usr/lib/wine/wine64 --version
          /usr/lib/wine/wine64 wineboot.exe --init
          # binfmt doesn't work in GitHub Actions
          #sudo apt install -y binfmt-support wine-binfmt
          #echo ":Wine:M::MZ::/usr/bin/wine:" > /etc/binfmt.d/wine.conf
          #sudo systemctl restart systemd-binfmt
      - name: Build
        run: |
          meson setup build --cross-file build-aux/cross/mingw64.ini --cross-file build-aux/cross/wine64.ini -Ddefault_library=shared
          meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)"
          cp /usr/x86_64-w64-mingw32/lib/libwinpthread-1.dll build/
          gcc_runtime=$(x86_64-w64-mingw32-gcc -print-file-name=libgcc_s_seh-1.dll)
          if test ! -f "$gcc_runtime"; then
            gcc_runtime=$(find /usr/lib/gcc/x86_64-w64-mingw32 /usr/x86_64-w64-mingw32 -name libgcc_s_seh-1.dll -print -quit)
          fi
          cp "$gcc_runtime" build/
          # Script drivers also run executables from source-free directories.
          wine_path=$(/usr/lib/wine/wine64 winepath.exe -w "$PWD/build")
          printf 'WINEPATH=%s\n' "$wine_path" >> "$GITHUB_ENV"

      - name: Run built-in tests
        run: |
          meson test -C build --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3

  windows-msys:
    name: Windows MSYS2
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git diffutils python mingw-w64-ucrt-x86_64-meson mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-dlfcn
      - name: Build
        run: |
          meson setup build -Dwerror=true -Ddefault_library=both
          meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)"

      - name: Stats
        run: |
          ./build/qjs -qd
      - name: Run built-in tests
        run: |
          meson test -C build --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3

      - name: Run microbench
        run: |
          meson compile -C build microbench

  linux-shared-install:
    name: Linux shared library installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config
      - name: Build and test the shared configuration
        run: |
          meson setup build --prefix "$RUNNER_TEMP/quickjs-install" -Dwerror=true -Ddefault_library=shared
          meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)"
          meson test -C build --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)"
      - name: Install and exercise public consumers
        run: |
          meson install -C build
          prefix="$RUNNER_TEMP/quickjs-install"
          "$prefix/bin/qjs" -e 'if (6 * 7 !== 42) throw Error("installed qjs");'
          python3 tests/test_qjsc_executable.py "$prefix/bin/qjsc" '' '' n y
          export PKG_CONFIG_PATH="$prefix/lib/x86_64-linux-gnu/pkgconfig:$prefix/lib64/pkgconfig:$prefix/lib/pkgconfig"
          libdir="$(pkg-config --variable=libdir quickjs)"
          cc tests/test_shared_api.c $(pkg-config --cflags --libs quickjs) \
            -Wl,-rpath,"$libdir/quickjs" -o "$RUNNER_TEMP/public-embedding"
          "$RUNNER_TEMP/public-embedding"
