name: ci

on:
  pull_request:
    paths:
      - '**'
      - '!.gitignore'
      - '!LICENSE'
      - '!TODO'
      - '!doc/**'
      - '!examples/**'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - '*'
      # Scratch publication gets exact-commit correctness CI; history/** stays excluded.
      - 'scratch/**'

jobs:
  linux:
    name: Linux (Ubuntu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build
        run: |
          make CONFIG_TEMPORAL=n CONFIG_INTL=n -j$(getconf _NPROCESSORS_ONLN) CONFIG_WERROR=y
      - name: Stats
        run: |
          ./qjs -qd
      - name: Run built-in tests
        run: |
          make CONFIG_TEMPORAL=n CONFIG_INTL=n test
      - name: Run microbench
        run: |
          make CONFIG_TEMPORAL=n CONFIG_INTL=n microbench
      - name: Run test262
        run: |
          make CONFIG_TEMPORAL=n CONFIG_INTL=n test2-bootstrap
          ./run-test262 -t -m -c test262-ci-none.conf -a

  linux-lto:
    name: Linux LTO
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build
        run: |
          make CONFIG_TEMPORAL=n CONFIG_INTL=n -j$(getconf _NPROCESSORS_ONLN) CONFIG_WERROR=y CONFIG_LTO=y
      - name: Run built-in tests
        run: |
          make CONFIG_TEMPORAL=n CONFIG_INTL=n test
      - name: Run microbench
        run: |
          make CONFIG_TEMPORAL=n CONFIG_INTL=n microbench

  linux-32bit:
    name: Linux 32bit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install gcc-multilib
        run: |
          sudo apt update
          sudo apt install -y gcc-multilib
      - name: Build
        run: |
          make CONFIG_TEMPORAL=n CONFIG_INTL=n -j$(getconf _NPROCESSORS_ONLN) CONFIG_WERROR=y CONFIG_M32=y
      - name: Run built-in tests
        run: |
          make CONFIG_TEMPORAL=n CONFIG_INTL=n CONFIG_M32=y test
      - name: Run test262
        run: |
          make CONFIG_TEMPORAL=n CONFIG_INTL=n test2-bootstrap
          ./run-test262 -t -m -c test262-ci-none.conf -a

  linux-sanitizers:
    name: Linux ${{ matrix.compiler }} ${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        sanitizer: [ASan, UBSan]
    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      COMPILER: ${{ matrix.compiler }}
      USE_CLANG: ${{ matrix.compiler == 'clang' && 'y' || '' }}
      USE_ASAN: ${{ matrix.sanitizer == 'ASan' && 'y' || '' }}
      USE_UBSAN: ${{ matrix.sanitizer == 'UBSan' && 'y' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build
        run: |
          make CONFIG_TEMPORAL=n CONFIG_INTL=n -j$(getconf _NPROCESSORS_ONLN) CONFIG_WERROR=y CONFIG_LTO= \
            CC="$COMPILER" HOST_CC="$COMPILER" CONFIG_CLANG="$USE_CLANG" \
            CONFIG_ASAN="$USE_ASAN" CONFIG_UBSAN="$USE_UBSAN"
      - name: Run built-in tests
        run: |
          make CONFIG_TEMPORAL=n CONFIG_INTL=n CONFIG_WERROR=y CONFIG_LTO= \
            CC="$COMPILER" HOST_CC="$COMPILER" CONFIG_CLANG="$USE_CLANG" \
            CONFIG_ASAN="$USE_ASAN" CONFIG_UBSAN="$USE_UBSAN" test
      - name: Install pinned Test262
        run: |
          make CONFIG_TEMPORAL=n CONFIG_INTL=n test2-bootstrap
      - name: Run Test262
        run: |
          ./run-test262 -T 2 -t -m -c test262-ci-none.conf -a
      - name: Preserve Test262 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test262-${{ matrix.compiler }}-${{ matrix.sanitizer }}
          path: |
            test262_report.txt
            test262_errors.txt

  linux-msan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build
        env:
          CC: clang
        run: |
          make CONFIG_TEMPORAL=n CONFIG_INTL=n -j$(getconf _NPROCESSORS_ONLN) CONFIG_WERROR=y CONFIG_MSAN=y CONFIG_CLANG=y
      - name: Run built-in tests
        env:
          MSAN_OPTIONS: halt_on_error=1
        run: |
          make CONFIG_TEMPORAL=n CONFIG_INTL=n CONFIG_MSAN=y CONFIG_CLANG=y test

  macos:
    name: macOS
    runs-on: macos-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          make CONFIG_TEMPORAL=n CONFIG_INTL=n -j$(getconf _NPROCESSORS_ONLN) CONFIG_WERROR=y
      - name: Stats
        run: |
          ./qjs -qd
      - name: Run built-in tests
        run: |
          make CONFIG_TEMPORAL=n CONFIG_INTL=n test
      - name: Run test262
        run: |
          make CONFIG_TEMPORAL=n CONFIG_INTL=n test2-bootstrap
          ./run-test262 -t -m -c test262-ci-none.conf -a

  macos-asan:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          make CONFIG_TEMPORAL=n CONFIG_INTL=n -j$(getconf _NPROCESSORS_ONLN) CONFIG_WERROR=y CONFIG_ASAN=y
      - name: Run built-in tests
        env:
          ASAN_OPTIONS: halt_on_error=1
        run: |
          make CONFIG_TEMPORAL=n CONFIG_INTL=n CONFIG_ASAN=y test

  macos-ubsan:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          make CONFIG_TEMPORAL=n CONFIG_INTL=n -j$(getconf _NPROCESSORS_ONLN) CONFIG_WERROR=y CONFIG_UBSAN=y
      - name: Run built-in tests
        env:
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          make CONFIG_TEMPORAL=n CONFIG_INTL=n CONFIG_UBSAN=y test

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + test
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          copyback: false
          mem: 16384
          prepare: |
            pkg install -y gmake python3
          run: |
            gmake CONFIG_TEMPORAL=n CONFIG_INTL=n
            ./qjs -qd
            gmake CONFIG_TEMPORAL=n CONFIG_INTL=n test

  cosmopolitan:
    name: Cosmopolitan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Cosmopolitan
        run: |
          mkdir ~/cosmocc
          cd ~/cosmocc
          wget https://cosmo.zip/pub/cosmocc/cosmocc.zip
          unzip cosmocc.zip
          echo "$HOME/cosmocc/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          make CONFIG_TEMPORAL=n CONFIG_INTL=n CONFIG_COSMO=y
      - name: Run built-in tests
        run: |
          make CONFIG_TEMPORAL=n CONFIG_INTL=n CONFIG_COSMO=y test
      - name: Run test262
        run: |
          make CONFIG_TEMPORAL=n CONFIG_INTL=n test2-bootstrap
          ./run-test262 -t -m -c test262-ci-none.conf -a

  mingw-windows:
    name: MinGW Windows target
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install MinGW and Wine
        run: |
          sudo apt update
          sudo apt install -y wine mingw-w64
          cp /usr/x86_64-w64-mingw32/lib/libwinpthread-1.dll .
      - name: Setup Wine
        run: |
          wine --version
          winecfg /v
          # binfmt doesn't work in GitHub Actions
          #sudo apt install -y binfmt-support wine-binfmt
          #echo ":Wine:M::MZ::/usr/bin/wine:" > /etc/binfmt.d/wine.conf
          #sudo systemctl restart systemd-binfmt
      - name: Build
        run: |
          make CONFIG_TEMPORAL=n CONFIG_INTL=n CONFIG_WIN32=y
      - name: Run built-in tests
        run: |
          # If binfmt support worked, could just run `make CONFIG_WIN32=y test`
          make CONFIG_TEMPORAL=n CONFIG_INTL=n WINE=/usr/bin/wine CONFIG_WIN32=y test

  windows-msys:
    name: Windows MSYS2
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git make diffutils python mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-dlfcn
      - name: Build
        run: |
           make CONFIG_TEMPORAL=n CONFIG_INTL=n -j$(getconf _NPROCESSORS_ONLN) CONFIG_WERROR=y
      - name: Stats
        run: |
          ./qjs -qd
      - name: Run built-in tests
        run: |
          make CONFIG_TEMPORAL=n CONFIG_INTL=n test
      - name: Run microbench
        run: |
          make CONFIG_TEMPORAL=n CONFIG_INTL=n microbench


  qemu-alpine:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/386
          - linux/riscv64
          - linux/arm64
          - linux/arm/v6
          - linux/arm/v7
          - linux/s390x
          - linux/ppc64le

    steps:
      - uses: actions/checkout@v4
        with:
            submodules: recursive
      - name: Get qemu
        # See https://github.com/tonistiigi/binfmt/issues/215#issuecomment-2613004741
        run: docker run --privileged --rm tonistiigi/binfmt:master --install all
      - name: Run tests on ${{ matrix.platform }}
        run: docker run --rm --interactive --mount type=bind,source=$(pwd),target=/host --platform ${{ matrix.platform }} alpine sh -c "apk add git patch make gcc libc-dev python3 && cd /host && make CONFIG_TEMPORAL=n CONFIG_INTL=n test"
