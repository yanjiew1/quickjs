name: ci

on:
  pull_request:
    paths:
      - '**'
      - '!.gitignore'
      - '!LICENSE'
      - '!TODO'
      - '!doc/**'
      - '!examples/**'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - '*'

env:
  MAKEFLAGS: 'CONFIG_TEMPORAL=n CONFIG_INTL=n'

jobs:
  linux:
    name: Linux (Ubuntu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build
        run: |
          make -j$(getconf _NPROCESSORS_ONLN) CONFIG_WERROR=y
      - name: Stats
        run: |
          ./qjs -qd
      - name: Run built-in tests
        run: |
          make test
      - name: Run microbench
        run: |
          make microbench
      - name: Run test262
        run: |
          make test2-bootstrap
          make test2 TEST262_TIMING_LOG=test262_timings.jsonl

      - name: Report Test262 timings
        if: always()
        run: |
          if test -f test262_timings.jsonl; then
            report_status=0
            python3 tools/ci/report_test262_timings.py test262_timings.jsonl \
              --csv test262_timings.csv --markdown test262_timings.md || report_status=$?
            cat test262_timings.md >> "$GITHUB_STEP_SUMMARY"
            exit "$report_status"
          fi
      - name: Preserve Test262 timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test262-timings-linux
          path: |
            test262_timings.jsonl
            test262_timings.csv
            test262_timings.md

  linux-lto:
    name: Linux LTO
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build
        run: |
          make -j$(getconf _NPROCESSORS_ONLN) CONFIG_WERROR=y CONFIG_LTO=y LTO_FLAG=-flto=auto all test-binaries
      - name: Run built-in tests
        run: |
          make -j$(getconf _NPROCESSORS_ONLN) CONFIG_WERROR=y CONFIG_LTO=y LTO_FLAG=-flto=auto test
      - name: Run microbench
        run: |
          make CONFIG_LTO=y LTO_FLAG=-flto=auto microbench

  linux-32bit:
    name: Linux 32bit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install gcc-multilib
        run: |
          sudo apt update
          sudo apt install -y gcc-multilib
      - name: Build
        run: |
          make -j$(getconf _NPROCESSORS_ONLN) CONFIG_WERROR=y CONFIG_M32=y
      - name: Run built-in tests
        run: |
          make CONFIG_M32=y test
      - name: Run test262
        run: |
          make test2-bootstrap
          make CONFIG_M32=y test2 TEST262_TIMING_LOG=test262_timings.jsonl

      - name: Report Test262 timings
        if: always()
        run: |
          if test -f test262_timings.jsonl; then
            report_status=0
            python3 tools/ci/report_test262_timings.py test262_timings.jsonl \
              --csv test262_timings.csv --markdown test262_timings.md || report_status=$?
            cat test262_timings.md >> "$GITHUB_STEP_SUMMARY"
            exit "$report_status"
          fi
      - name: Preserve Test262 timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test262-timings-linux-32bit
          path: |
            test262_timings.jsonl
            test262_timings.csv
            test262_timings.md

  macos:
    name: macOS
    runs-on: macos-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          make -j$(getconf _NPROCESSORS_ONLN) CONFIG_WERROR=y
      - name: Stats
        run: |
          ./qjs -qd
      - name: Run built-in tests
        run: |
          make test
      - name: Run test262
        run: |
          make test2-bootstrap
          make test2 TEST262_TIMING_LOG=test262_timings.jsonl

      - name: Report Test262 timings
        if: always()
        run: |
          if test -f test262_timings.jsonl; then
            report_status=0
            python3 tools/ci/report_test262_timings.py test262_timings.jsonl \
              --csv test262_timings.csv --markdown test262_timings.md || report_status=$?
            cat test262_timings.md >> "$GITHUB_STEP_SUMMARY"
            exit "$report_status"
          fi
      - name: Preserve Test262 timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test262-timings-macos
          path: |
            test262_timings.jsonl
            test262_timings.csv
            test262_timings.md

  mingw-windows:
    name: MinGW Windows target
    runs-on: ubuntu-latest
    env:
      WINEARCH: win64
      WINEDEBUG: "-all"
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install MinGW and Wine
        run: |
          sudo apt update
          sudo apt install -y wine64 mingw-w64
          cp /usr/x86_64-w64-mingw32/lib/libwinpthread-1.dll .
          cp /usr/x86_64-w64-mingw32/lib/libwinpthread-1.dll tests/
      - name: Setup Wine
        run: |
          # Set the prefix here, where runner shell variables are available.
          export WINEPREFIX="$RUNNER_TEMP/quickjs-wine64"
          printf 'WINEPREFIX=%s\n' "$WINEPREFIX" >> "$GITHUB_ENV"
          # Use the 64-bit loader directly; the wrapper warns about wine32.
          test -x /usr/lib/wine/wine64
          /usr/lib/wine/wine64 --version
          /usr/lib/wine/wine64 wineboot.exe --init
          # binfmt doesn't work in GitHub Actions
          #sudo apt install -y binfmt-support wine-binfmt
          #echo ":Wine:M::MZ::/usr/bin/wine:" > /etc/binfmt.d/wine.conf
          #sudo systemctl restart systemd-binfmt
      - name: Build
        run: |
          make CONFIG_WIN32=y
      - name: Run built-in tests
        run: |
          # If binfmt support worked, could just run `make CONFIG_WIN32=y test`
          make WINE=/usr/lib/wine/wine64 CONFIG_WIN32=y test

  windows-msys:
    name: Windows MSYS2
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git make diffutils python mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-dlfcn
      - name: Build
        run: |
           make -j$(getconf _NPROCESSORS_ONLN) CONFIG_WERROR=y
      - name: Stats
        run: |
          ./qjs -qd
      - name: Run built-in tests
        run: |
          make test
      - name: Run microbench
        run: |
          make microbench
