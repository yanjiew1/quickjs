name: Intl date acceptance diagnostic

on:
  push:
    branches: ['scratch-intl-date-acceptance-*']

jobs:
  date-apis:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      CC: clang
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build clang
      - name: Build the native Intl test runner
        run: |
          meson setup build -Dwerror=true -Ddocumentation=disabled \
            -Dintl=native -Dtemporal=true -Db_sanitize=address,undefined
          meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)" qjs run-test262
      - name: Run date and Temporal locale API cases
        run: |
          python3 tools/build/test262.py bootstrap
          timeout 900s build/run-test262 -q -t -m \
            -T "$(getconf _NPROCESSORS_ONLN)" \
            -c tests/intl-datetime-diagnostic-test262.conf \
            --timing-log test262_date_timings.jsonl \
            --progress-log test262_date_progress.jsonl 2>&1 | tee test262_date.log
      - name: Report completed variants
        if: always()
        run: |
          if test -f test262_date_timings.jsonl; then
            python3 tools/ci/report_test262_timings.py test262_date_timings.jsonl \
              --csv test262_date_timings.csv --markdown test262_date_timings.md
            cat test262_date_timings.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: intl-date-acceptance
          path: |
            test262_date*
            build/meson-logs/meson-log.txt
          if-no-files-found: ignore
