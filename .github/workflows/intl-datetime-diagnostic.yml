name: intl-datetime-diagnostic

on:
  push:
    branches:
      - 'scratch-intl-datetime-acceptance-20261022'

jobs:
  intl-locale:
    name: Native Intl APIs (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: native
            temporal: 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build clang
      - name: Build and test enabled Intl with sanitizers
        env:
          CC: clang
        run: |
          meson setup build -Dwerror=true -Ddocumentation=disabled \
            -Dintl=${{ matrix.profile }} -Dtemporal=${{ matrix.temporal }} \
            -Ddefault_library=both -Db_sanitize=address,undefined
          meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)"
          meson test -C build --no-rebuild --print-errorlogs \
            --num-processes "$(getconf _NPROCESSORS_ONLN)"
      - name: Diagnose full DateTimeFormat Test262
        run: |
          python3 tools/build/test262.py bootstrap
          profile_config=()
          if test '${{ matrix.profile }}' = minimal; then
            profile_config=(-c tests/intl-minimal-test262.conf)
          fi
          timeout 300s build/run-test262 -T "$(getconf _NPROCESSORS_ONLN)" \
            -t -m -c tests/intl-datetime-diagnostic.conf \
            "${profile_config[@]}" \
            --timing-log test262_intl_timings.jsonl
      - name: Report per-test timings
        if: always()
        run: |
          if test -f test262_intl_timings.jsonl; then
            python3 tools/ci/report_test262_timings.py test262_intl_timings.jsonl \
              --csv test262_intl_timings.csv --markdown test262_intl_timings.md
            cat test262_intl_timings.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload locale API timing reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test262-intl-locale-${{ matrix.profile }}
          path: |
            test262_intl_timings.jsonl
            test262_intl_timings.csv
            test262_intl_timings.md
            build/meson-logs/testlog.txt
          if-no-files-found: ignore
