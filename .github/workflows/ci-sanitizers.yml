name: ci-sanitizers

on:
  pull_request:
    paths:
      - '**'
      - '!.gitignore'
      - '!LICENSE'
      - '!TODO'
      - '!doc/**'
      - '!examples/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/ci-sanitizers.yml'
  push:
    branches:
      - '*'

env:
  MAKEFLAGS: 'CONFIG_TEMPORAL=n CONFIG_INTL=n'

jobs:
  linux-sanitizers:
    name: Linux ${{ matrix.compiler }} ${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        sanitizer: [ASan, UBSan]
    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      COMPILER: ${{ matrix.compiler }}
      USE_CLANG: ${{ matrix.compiler == 'clang' && 'y' || '' }}
      USE_ASAN: ${{ matrix.sanitizer == 'ASan' && 'y' || '' }}
      USE_UBSAN: ${{ matrix.sanitizer == 'UBSan' && 'y' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Build
        run: |
          make -j$(getconf _NPROCESSORS_ONLN) CONFIG_WERROR=y CONFIG_LTO= \
            CC="$COMPILER" HOST_CC="$COMPILER" CONFIG_CLANG="$USE_CLANG" \
            CONFIG_ASAN="$USE_ASAN" CONFIG_UBSAN="$USE_UBSAN"
      - name: Run built-in tests
        run: |
          make CONFIG_WERROR=y CONFIG_LTO= \
            CC="$COMPILER" HOST_CC="$COMPILER" CONFIG_CLANG="$USE_CLANG" \
            CONFIG_ASAN="$USE_ASAN" CONFIG_UBSAN="$USE_UBSAN" test
      - name: Install pinned Test262
        run: make test2-bootstrap
      - name: Run Test262
        run: |
          set -o pipefail
          ./run-test262 -T "$(getconf _NPROCESSORS_ONLN)" --timing-log test262_timings.jsonl --progress-log test262_progress.jsonl -t -m -c test262.conf -a 2>&1 | tee test262_runtime.log
      - name: Report Test262 timings
        if: always()
        run: |
          if test -f test262_timings.jsonl; then
            report_status=0
            python3 tools/ci/report_test262_timings.py test262_timings.jsonl \
              --csv test262_timings.csv --markdown test262_timings.md || report_status=$?
            cat test262_timings.md >> "$GITHUB_STEP_SUMMARY"
            exit "$report_status"
          fi
      - name: Preserve Test262 diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test262-${{ matrix.compiler }}-${{ matrix.sanitizer }}
          path: |
            test262_runtime.log
            test262_progress.jsonl
            test262_timings.jsonl
            test262_timings.csv
            test262_timings.md

  linux-gc-stress:
    name: Linux allocation-triggered GC stress
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v7
      - name: Build and run focused GC stress tests
        run: |
          set -o pipefail
          make -j$(getconf _NPROCESSORS_ONLN) CC=gcc HOST_CC=gcc \
            CONFIG_WERROR=y CONFIG_LTO= CONFIG_ASAN=y CONFIG_UBSAN=y \
            CONFIG_GC_STRESS=y test-gc-stress 2>&1 | tee gc-stress.log
      - name: Preserve GC stress diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gc-stress
          path: gc-stress.log

  linux-msan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Build
        env:
          CC: clang
        run: |
          make -j$(getconf _NPROCESSORS_ONLN) CONFIG_WERROR=y CONFIG_MSAN=y CONFIG_CLANG=y
      - name: Run built-in tests
        env:
          MSAN_OPTIONS: halt_on_error=1
        run: |
          make CONFIG_MSAN=y CONFIG_CLANG=y test
      - name: Install pinned Test262
        run: make test2-bootstrap
      - name: Run Test262
        env:
          MSAN_OPTIONS: halt_on_error=1
        run: |
          set -o pipefail
          ./run-test262 -T "$(getconf _NPROCESSORS_ONLN)" --timing-log test262_timings.jsonl --progress-log test262_progress.jsonl -t -m -c test262.conf -a 2>&1 | tee test262_runtime.log
      - name: Report Test262 timings
        if: always()
        run: |
          if test -f test262_timings.jsonl; then
            report_status=0
            python3 tools/ci/report_test262_timings.py test262_timings.jsonl \
              --csv test262_timings.csv --markdown test262_timings.md || report_status=$?
            cat test262_timings.md >> "$GITHUB_STEP_SUMMARY"
            exit "$report_status"
          fi
      - name: Preserve Test262 diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test262-clang-MSan
          path: |
            test262_runtime.log
            test262_progress.jsonl
            test262_timings.jsonl
            test262_timings.csv
            test262_timings.md

  macos-asan:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          make -j$(getconf _NPROCESSORS_ONLN) CONFIG_WERROR=y CONFIG_ASAN=y
      - name: Run built-in tests
        env:
          ASAN_OPTIONS: halt_on_error=1
        run: |
          make CONFIG_ASAN=y test

  macos-ubsan:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          make -j$(getconf _NPROCESSORS_ONLN) CONFIG_WERROR=y CONFIG_UBSAN=y
      - name: Run built-in tests
        env:
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          make CONFIG_UBSAN=y test
