name: ci-sanitizers

on:
  pull_request:
    paths:
      - '**'
      - '!.gitignore'
      - '!LICENSE'
      - '!TODO'
      - '!doc/**'
      - '!examples/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/ci-sanitizers.yml'
  push:
    branches:
      - '*'

jobs:
  linux-sanitizers:
    name: Linux ${{ matrix.arch }} ${{ matrix.compiler }} ${{ matrix.sanitizer }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        sanitizer: [ASan, UBSan]
        arch: [x86_64, arm64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      COMPILER: ${{ matrix.compiler }}
      # ASan bypasses small-block pools; UBSan must cover pooled iteration.
      USE_MALLOC_ITER: ${{ matrix.compiler == 'gcc' && matrix.sanitizer == 'UBSan' && 'y' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install Meson and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build
      - name: Build
        run: |
          sanitizer=undefined
          if test "${{ matrix.sanitizer }}" = ASan; then sanitizer=address; fi
          iteration=false
          if test "$USE_MALLOC_ITER" = y; then iteration=true; fi
          CC="$COMPILER" meson setup build -Dwerror=true -Db_sanitize="$sanitizer" -Dmalloc_iter="$iteration"
          meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)"

      - name: Run built-in tests
        run: |
          meson test -C build --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3

      - name: Install pinned Test262
        run: python3 tools/build/test262.py bootstrap
      - name: Run Test262
        # GCC ARM64 fake-stack scanning dominates long loops. Retain UAR
        # checks in its repo tests and in Clang/x86 full Test262 runs.
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=1:detect_stack_use_after_return=${{ matrix.arch == 'arm64' && matrix.compiler == 'gcc' && '0' || '1' }}
        run: |
          set -o pipefail
          ./build/run-test262 -T "$(getconf _NPROCESSORS_ONLN)" --timing-log test262_timings.jsonl --progress-log test262_progress.jsonl -t -m -c test262.conf -a 2>&1 | tee test262_runtime.log
      - name: Report Test262 timings
        if: always()
        run: |
          if test -f test262_timings.jsonl; then
            report_status=0
            python3 tools/ci/report_test262_timings.py test262_timings.jsonl \
              --csv test262_timings.csv --markdown test262_timings.md || report_status=$?
            cat test262_timings.md >> "$GITHUB_STEP_SUMMARY"
            exit "$report_status"
          fi
      - name: Preserve Test262 diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test262-${{ matrix.arch }}-${{ matrix.compiler }}-${{ matrix.sanitizer }}
          path: |
            test262_runtime.log
            test262_progress.jsonl
            test262_timings.jsonl
            test262_timings.csv
            test262_timings.md

  linux-shared-sanitizers:
    name: Linux Clang shared ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v7
      - name: Install Meson and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build
      - name: Build and test the shared engine
        run: |
          CC=clang meson setup build -Dwerror=true -Ddefault_library=shared -Db_sanitize=address,undefined
          meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)"
          meson test -C build --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3

  linux-gc-stress:
    name: Linux ${{ matrix.arch }} allocation-triggered GC stress
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            compiler: gcc
          - arch: arm64
            runner: ubuntu-24.04-arm
            # Keep UAR coverage without GCC ARM64 fake-stack scanning costs.
            compiler: clang
    timeout-minutes: 25
    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v7
      - name: Install Meson and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build
      - name: Build and run focused GC stress tests
        run: |
          set -o pipefail
          CC="${{ matrix.compiler }}" meson setup build -Dwerror=true -Db_sanitize=address,undefined -Dgc_stress=true -Dmalloc_iter=true
          meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)"
          meson test -C build --suite gc-stress --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3 2>&1 | tee gc-stress.log

      - name: Preserve GC stress diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gc-stress-${{ matrix.arch }}
          path: gc-stress.log

  linux-tsan:
    name: Linux ${{ matrix.arch }} focused thread sanitizer
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      TSAN_OPTIONS: halt_on_error=1:exitcode=66
    steps:
      - uses: actions/checkout@v7
      - name: Install Meson and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build
      - name: Check ThreadSanitizer startup
        run: |
          set -o pipefail
          mkdir -p tsan-logs
          # GCC TSan needs a compatible shadow mapping on this ephemeral runner.
          if test "$(sysctl -n vm.mmap_rnd_bits)" -gt 28; then
            sudo sysctl -w vm.mmap_rnd_bits=28
          fi
          printf 'int main(void) { return 0; }\n' > tsan-logs/probe.c
          gcc -g -O1 -fsanitize=thread tsan-logs/probe.c -o tsan-logs/probe
          ./tsan-logs/probe 2>&1 | tee tsan-logs/startup.log
      - name: Build and run focused concurrency tests
        run: |
          set -o pipefail
          CC=gcc meson setup build -Dwerror=true -Db_sanitize=thread
          meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)"
          meson test -C build --suite threading --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3 2>&1 | tee tsan-logs/tests.log
          meson test -C build --no-rebuild --repeat 2 test_wait_queue worker --print-errorlogs 2>&1 | tee -a tsan-logs/tests.log

      - name: Preserve ThreadSanitizer diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: thread-sanitizer-${{ matrix.arch }}
          path: tsan-logs/

  linux-msan:
    name: Linux ${{ matrix.arch }} MSan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install Meson and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build
      - name: Build
        env:
          CC: clang
        run: |
          CC=clang meson setup build -Dwerror=true -Db_sanitize=memory -Db_pie=true
          meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)"

      - name: Run built-in tests
        env:
          MSAN_OPTIONS: halt_on_error=1
        run: |
          meson test -C build --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3

      - name: Install pinned Test262
        run: python3 tools/build/test262.py bootstrap
      - name: Run Test262
        env:
          MSAN_OPTIONS: halt_on_error=1
        run: |
          set -o pipefail
          ./build/run-test262 -T "$(getconf _NPROCESSORS_ONLN)" --timing-log test262_timings.jsonl --progress-log test262_progress.jsonl -t -m -c test262.conf -a 2>&1 | tee test262_runtime.log
      - name: Report Test262 timings
        if: always()
        run: |
          if test -f test262_timings.jsonl; then
            report_status=0
            python3 tools/ci/report_test262_timings.py test262_timings.jsonl \
              --csv test262_timings.csv --markdown test262_timings.md || report_status=$?
            cat test262_timings.md >> "$GITHUB_STEP_SUMMARY"
            exit "$report_status"
          fi
      - name: Preserve Test262 diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test262-clang-MSan-${{ matrix.arch }}
          path: |
            test262_runtime.log
            test262_progress.jsonl
            test262_timings.jsonl
            test262_timings.csv
            test262_timings.md

  macos-asan:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Meson and Ninja
        run: |
          brew install meson ninja
      - name: Build
        run: |
          meson setup build -Dwerror=true -Db_sanitize=address
          meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)"

      - name: Run built-in tests
        env:
          ASAN_OPTIONS: halt_on_error=1
        run: |
          meson test -C build --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3

  macos-ubsan:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Meson and Ninja
        run: |
          brew install meson ninja
      - name: Build
        run: |
          meson setup build -Dwerror=true -Db_sanitize=undefined
          meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)"

      - name: Run built-in tests
        env:
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          meson test -C build --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3
