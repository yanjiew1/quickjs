name: ci-sanitizers

on:
  pull_request:
    paths:
    - '**'
    - '!.gitignore'
    - '!LICENSE'
    - '!TODO'
    - '!doc/**'
    - '!examples/**'
    - '.github/workflows/ci.yml'
    - '.github/workflows/ci-sanitizers.yml'
  push:
    branches:
    - '*'

jobs:
  intl-locale:
    name: Native Intl APIs (${{ matrix.profile }}, Temporal ${{ matrix.temporal }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    strategy:
      fail-fast: false
      matrix:
        include:
        - profile: minimal
          temporal: 'false'
        - profile: native
          temporal: 'true'
        - profile: minimal
          temporal: 'true'
        - profile: native
          temporal: 'false'
    steps:
    - uses: actions/checkout@v7
    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build clang
    - name: Configure enabled Intl with sanitizers
      env:
        CC: clang
      run: |
        meson setup build -Dwerror=true -Ddocumentation=disabled \
          -Dintl=${{ matrix.profile }} -Dtemporal=${{ matrix.temporal }} \
          -Dcalendars=native -Dtimezone_backend=native -Dsystem_timezone_policy=utc \
          -Ddefault_library=both -Db_sanitize=address,undefined
    - name: Compile selected targets
      id: compile
      run: |
        meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)"
    - name: Run repository unit tests
      run: |
        meson test -C build --no-rebuild --suite unit --logbase repo-unit \
          --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)"
    - name: Run repository integration tests
      if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      run: |
        meson test -C build --no-rebuild --suite integration --logbase repo-integration \
          --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)"
    - name: Audit every prepared DateTimeFormat locale and calendar
      run: |
        python3 tools/ci/audit_intl_datetime.py \
          build/tests/test_intl_date_service_${{ matrix.profile }} \
          --threads "$(getconf _NPROCESSORS_ONLN)"
    - name: Install pinned Test262
      run: |
        python3 tools/build/test262.py bootstrap
    - name: Check all Intl entry points against Test262
      run: |
        profile_config=()
        if test '${{ matrix.profile }}' = minimal && test -f tests/intl-minimal-test262.conf; then
          profile_config=(-c tests/intl-minimal-test262.conf)
        fi
        # Include wrappers and Temporal integration as well as constructors.
        # Keep the complete selection bounded and report every test's time.
        timeout --kill-after=30s 900s build/run-test262 -T "$(getconf _NPROCESSORS_ONLN)" \
          -t -m -c tests/intl-locale-test262.conf \
          "${profile_config[@]}" \
          --timing-log test262_intl_timings.jsonl \
          --progress-log test262_intl_progress.jsonl
    - name: Report repository test results
      if: always()
      run: |
        sh tools/ci/report_repo_results.sh
    - name: Report per-test timings
      if: always()
      run: |
        if test -f test262_intl_timings.jsonl; then
          python3 tools/ci/report_test262_timings.py test262_intl_timings.jsonl \
            --csv test262_intl_timings.csv --markdown test262_intl_timings.md
          cat test262_intl_timings.md >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Upload locale API timing reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test262-intl-locale-${{ matrix.profile }}-temporal-${{ matrix.temporal }}
        path: |
          test262_intl_timings.jsonl
          test262_intl_timings.csv
          test262_intl_timings.md
          test262_intl_progress.jsonl
          build/meson-logs/repo-unit.*
          build/meson-logs/repo-integration.*
        if-no-files-found: ignore
  linux-sanitizers:
    name: Linux ${{ matrix.arch }} ${{ matrix.compiler }} ${{ matrix.sanitizer }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        sanitizer: [ASan, UBSan]
        arch: [x86_64, arm64]
        include:
        - arch: x86_64
          runner: ubuntu-latest
        - arch: arm64
          runner: ubuntu-24.04-arm
    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      COMPILER: ${{ matrix.compiler }}
      # ASan bypasses small-block pools; UBSan must cover pooled iteration.
      USE_MALLOC_ITER: ${{ matrix.compiler == 'gcc' && matrix.sanitizer == 'UBSan' && 'y' || '' }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Install Meson and Ninja
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build
    - name: Configure selected sanitizer
      run: |
        sanitizer=undefined
        if test "${{ matrix.sanitizer }}" = ASan; then sanitizer=address; fi
        iteration=false
        if test "$USE_MALLOC_ITER" = y; then iteration=true; fi
        CC="$COMPILER" meson setup build -Dwerror=true -Db_sanitize="$sanitizer" -Dmalloc_iter="$iteration"
    - name: Compile selected targets
      id: compile
      run: |
        meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)"
    - name: Run repository unit tests
      run: |
        meson test -C build --no-rebuild --suite unit --logbase repo-unit \
          --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3
    - name: Run repository integration tests
      if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      run: |
        meson test -C build --no-rebuild --suite integration --logbase repo-integration \
          --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3

    - name: Install pinned Test262
      run: |
        python3 tools/build/test262.py bootstrap
    - name: Run Test262
        # GCC ARM64 fake-stack scanning dominates long loops. Retain UAR
        # checks in functional repo tests and in Clang/x86 full Test262 runs.
      env:
        ASAN_OPTIONS: halt_on_error=1:detect_leaks=1:detect_stack_use_after_return=${{ matrix.arch == 'arm64' && matrix.compiler == 'gcc' && '0' || '1' }}
      run: |
        set -o pipefail
        timeout --kill-after=30s 3600s ./build/run-test262 -T "$(getconf _NPROCESSORS_ONLN)" --timing-log test262_timings.jsonl --progress-log test262_progress.jsonl -t -m -c test262.conf -a 2>&1 | tee test262_runtime.log
    - name: Report repository test results
      if: always()
      run: |
        sh tools/ci/report_repo_results.sh
    - name: Report Test262 timings
      if: always()
      run: |
        if test -f test262_timings.jsonl; then
          report_status=0
          python3 tools/ci/report_test262_timings.py test262_timings.jsonl \
            --csv test262_timings.csv --markdown test262_timings.md || report_status=$?
          cat test262_timings.md >> "$GITHUB_STEP_SUMMARY"
          python3 tools/ci/audit_temporal_test262.py test262_timings.jsonl \
            --markdown test262_selection.md || report_status=$?
          cat test262_selection.md >> "$GITHUB_STEP_SUMMARY"
          exit "$report_status"
        fi
    - name: Preserve Test262 diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test262-${{ matrix.arch }}-${{ matrix.compiler }}-${{ matrix.sanitizer }}
        path: |
          test262_runtime.log
          test262_progress.jsonl
          test262_timings.jsonl
          test262_timings.csv
          test262_timings.md
          test262_selection.md
          build/meson-logs/repo-unit.*
          build/meson-logs/repo-integration.*

  linux-shared-sanitizers:
    name: Linux Clang shared ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
    - uses: actions/checkout@v7
    - name: Install Meson and Ninja
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build
    - name: Configure the shared engine
      run: |
        CC=clang meson setup build -Dwerror=true -Ddefault_library=shared -Db_sanitize=address,undefined
    - name: Compile selected targets
      id: compile
      run: |
        meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)"
    - name: Run repository unit tests
      run: |
        meson test -C build --no-rebuild --suite unit --logbase repo-unit \
          --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3
    - name: Run repository integration tests
      if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      run: |
        meson test -C build --no-rebuild --suite integration --logbase repo-integration \
          --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3
    - name: Report repository test results
      if: always()
      run: |
        sh tools/ci/report_repo_results.sh
    - name: Preserve repository test diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: linux-shared-sanitizers
        path: |
          build/meson-logs/repo-unit.*
          build/meson-logs/repo-integration.*
        if-no-files-found: ignore

  linux-gc-stress:
    name: Linux ${{ matrix.arch }} allocation-triggered GC stress
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          runner: ubuntu-latest
          compiler: gcc
        - arch: arm64
          runner: ubuntu-24.04-arm
            # Keep UAR coverage without GCC ARM64 fake-stack scanning costs.
          compiler: clang
    timeout-minutes: 25
    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
    - uses: actions/checkout@v7
    - name: Install Meson and Ninja
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build
    - name: Configure allocation-triggered GC stress
      run: |
        CC="${{ matrix.compiler }}" meson setup build -Dwerror=true -Db_sanitize=address,undefined -Dgc_stress=true -Dmalloc_iter=true
    - name: Compile selected targets
      id: compile
      run: |
        meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)"
    - name: Run focused GC stress tests
      run: |
        set -o pipefail
        meson test -C build --no-rebuild --suite gc-stress --logbase gc-stress \
          --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3 2>&1 | tee gc-stress.log

    - name: Preserve GC stress diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: gc-stress-${{ matrix.arch }}
        path: |
          gc-stress.log
          build/meson-logs/gc-stress.*

  linux-tsan:
    name: Linux ${{ matrix.arch }} focused thread sanitizer
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          runner: ubuntu-latest
        - arch: arm64
          runner: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      TSAN_OPTIONS: halt_on_error=1:exitcode=66
    steps:
    - uses: actions/checkout@v7
    - name: Install Meson and Ninja
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build
    - name: Check ThreadSanitizer startup
      run: |
        set -o pipefail
        mkdir -p tsan-logs
        # GCC TSan needs a compatible shadow mapping on this ephemeral runner.
        if test "$(sysctl -n vm.mmap_rnd_bits)" -gt 28; then
          sudo sysctl -w vm.mmap_rnd_bits=28
        fi
        printf 'int main(void) { return 0; }\n' > tsan-logs/probe.c
        gcc -g -O1 -fsanitize=thread tsan-logs/probe.c -o tsan-logs/probe
        ./tsan-logs/probe 2>&1 | tee tsan-logs/startup.log
    - name: Configure ThreadSanitizer
      run: |
        CC=gcc meson setup build -Dwerror=true -Db_sanitize=thread
    - name: Compile selected targets
      id: compile
      run: |
        meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)"
    - name: Run focused concurrency tests
      run: |
        set -o pipefail
        meson test -C build --no-rebuild --suite threading --logbase threading \
          --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3 2>&1 | tee tsan-logs/tests.log
    - name: Repeat wait-queue and worker tests
      run: |
        set -o pipefail
        meson test -C build --no-rebuild --repeat 2 test_wait_queue worker --logbase threading-repeat \
          --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" 2>&1 | tee tsan-logs/repeats.log

    - name: Preserve ThreadSanitizer diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: thread-sanitizer-${{ matrix.arch }}
        path: |
          tsan-logs/
          build/meson-logs/threading.*
          build/meson-logs/threading-repeat.*

  linux-msan:
    name: Linux ${{ matrix.arch }} MSan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          runner: ubuntu-latest
        - arch: arm64
          runner: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Install Meson and Ninja
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build
    - name: Configure MemorySanitizer with PIE
      env:
        CC: clang
      run: |
        meson setup build -Dwerror=true -Db_sanitize=memory -Db_pie=true
    - name: Compile selected targets
      id: compile
      run: |
        meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)"
    - name: Run repository unit tests
      env:
        MSAN_OPTIONS: halt_on_error=1
      run: |
        meson test -C build --no-rebuild --suite unit --logbase repo-unit \
          --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3
    - name: Run repository integration tests
      if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      env:
        MSAN_OPTIONS: halt_on_error=1
      run: |
        meson test -C build --no-rebuild --suite integration --logbase repo-integration \
          --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3

    - name: Install pinned Test262
      run: |
        python3 tools/build/test262.py bootstrap
    - name: Run Test262
      env:
        MSAN_OPTIONS: halt_on_error=1
      run: |
        set -o pipefail
        timeout --kill-after=30s 3600s ./build/run-test262 -T "$(getconf _NPROCESSORS_ONLN)" --timing-log test262_timings.jsonl --progress-log test262_progress.jsonl -t -m -c test262.conf -a 2>&1 | tee test262_runtime.log
    - name: Report repository test results
      if: always()
      run: |
        sh tools/ci/report_repo_results.sh
    - name: Report Test262 timings
      if: always()
      run: |
        if test -f test262_timings.jsonl; then
          report_status=0
          python3 tools/ci/report_test262_timings.py test262_timings.jsonl \
            --csv test262_timings.csv --markdown test262_timings.md || report_status=$?
          cat test262_timings.md >> "$GITHUB_STEP_SUMMARY"
          python3 tools/ci/audit_temporal_test262.py test262_timings.jsonl \
            --markdown test262_selection.md || report_status=$?
          cat test262_selection.md >> "$GITHUB_STEP_SUMMARY"
          exit "$report_status"
        fi
    - name: Preserve Test262 diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test262-clang-MSan-${{ matrix.arch }}
        path: |
          test262_runtime.log
          test262_progress.jsonl
          test262_timings.jsonl
          test262_timings.csv
          test262_timings.md
          test262_selection.md
          build/meson-logs/repo-unit.*
          build/meson-logs/repo-integration.*

  macos-asan:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - name: Install Meson and Ninja
      run: |
        brew install meson ninja
    - name: Configure selected sanitizer
      run: |
        meson setup build -Dwerror=true -Db_sanitize=address
    - name: Compile selected targets
      id: compile
      run: |
        meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)"
    - name: Run repository unit tests
      env:
        ASAN_OPTIONS: halt_on_error=1
      run: |
        meson test -C build --no-rebuild --suite unit --logbase repo-unit \
          --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3
    - name: Run repository integration tests
      if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      env:
        ASAN_OPTIONS: halt_on_error=1
      run: |
        meson test -C build --no-rebuild --suite integration --logbase repo-integration \
          --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3
    - name: Report repository test results
      if: always()
      run: |
        sh tools/ci/report_repo_results.sh
    - name: Preserve repository test diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: macos-asan
        path: |
          build/meson-logs/repo-unit.*
          build/meson-logs/repo-integration.*
        if-no-files-found: ignore

  macos-ubsan:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - name: Install Meson and Ninja
      run: |
        brew install meson ninja
    - name: Configure selected sanitizer
      run: |
        meson setup build -Dwerror=true -Db_sanitize=undefined
    - name: Compile selected targets
      id: compile
      run: |
        meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)"
    - name: Run repository unit tests
      env:
        UBSAN_OPTIONS: halt_on_error=1
      run: |
        meson test -C build --no-rebuild --suite unit --logbase repo-unit \
          --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3
    - name: Run repository integration tests
      if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
      env:
        UBSAN_OPTIONS: halt_on_error=1
      run: |
        meson test -C build --no-rebuild --suite integration --logbase repo-integration \
          --print-errorlogs --num-processes "$(getconf _NPROCESSORS_ONLN)" --timeout-multiplier 3
    - name: Report repository test results
      if: always()
      run: |
        sh tools/ci/report_repo_results.sh
    - name: Preserve repository test diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: macos-ubsan
        path: |
          build/meson-logs/repo-unit.*
          build/meson-logs/repo-integration.*
        if-no-files-found: ignore
