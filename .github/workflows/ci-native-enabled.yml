name: historical-native-prefix-qualification
# Preserved sealed qualification for historical checkouts. Current branches use
# ci-current-test262.yml with unmodified raw outcomes and assertion-level checks.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prefix:
    name: prefix ${{ matrix.backend }} ${{ matrix.compiler }} ${{ matrix.sanitizer }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        backend: [native, icu]
        compiler: [gcc, clang]
        sanitizer: [normal, ASan, UBSan]
    env:
      MAKEFLAGS: ''
      PREFIX_BINDING_MODE: checkout
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      PREFIX_BACKEND: ${{ matrix.backend }}
      PREFIX_COMPILER: ${{ matrix.compiler }}
      PREFIX_SANITIZER: ${{ matrix.sanitizer }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 2
      - name: Run pure native policy parser projection and identity regressions
        run: |
          python3 -I -B -m unittest discover -s tools/ci/native-prefix -p 'test_*.py'
          python3 -I -B tests/test_selected_timezone_proof.py
          python3 -I -B tests/test_selected_timezone_orchestration.py
          python3 -I -B tests/test_selected_provider_postflight.py
          python3 -I -B -m unittest discover -s tools/ci/native-prefix/original-assertions -p 'test_h2_lunisolar_guard_proof.py'
          python3 -I -B tests/test_native_profile_selected_provider.py
      - name: Bind source and record environment
        id: binding
        run: |
          export PREFIX_ICU="$RUNNER_TEMP/native-prefix-icu"
          printf 'PREFIX_ICU=%s\n' "$PREFIX_ICU" >> "$GITHUB_ENV"
          python3 tools/ci/native-prefix/run.py initialize
      - name: Restore pinned ICU install
        if: matrix.backend == 'icu'
        id: icu-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PREFIX_ICU }}/install
          key: prefix-icu78.3-ubuntu24-${{ steps.binding.outputs.compiler_key }}-${{ hashFiles('tools/ci/native-prefix/icu-overlay.json', 'tools/ci/native-prefix/run.py') }}
      - name: Build pinned ICU release plus exact reviewed overlay
        if: matrix.backend == 'icu' && steps.icu-cache.outputs.cache-hit != 'true'
        run: python3 tools/ci/native-prefix/run.py setup-icu
      - name: Inspect pinned ICU install
        if: matrix.backend == 'icu'
        run: python3 tools/ci/native-prefix/run.py inspect-icu
      - name: Materialize pinned timezone source inputs
        run: python3 tools/ci/native-prefix/run.py timezone-inputs
      - name: Build candidate
        id: candidate
        run: python3 tools/ci/native-prefix/run.py build
      - name: Run bounded Hebrew lunisolar guard regressions
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        run: python3 tools/ci/native-prefix/run.py h2-lunisolar-guard-tests
      - name: Run repository tests
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        run: python3 tools/ci/native-prefix/run.py repository-tests
      - name: Run direct native C library units
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' && matrix.backend == 'native' }}
        run: python3 tools/ci/native-prefix/run.py native-units
      - name: Verify public API runtime and checked C/C++ signatures
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        run: python3 tools/ci/native-prefix/run.py public-api
      - name: Verify public APIs in fresh feature configurations
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        run: python3 tools/ci/native-prefix/run.py api-variants
      - name: Install and verify reviewed latest Test262 fixture
        id: fixture
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        run: python3 tools/ci/native-prefix/run.py bootstrap-test262
      - name: Run mandatory original oracle diagnostics and normative companions
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        run: python3 tools/ci/native-prefix/run.py oracle-diagnostics
      - name: Run current required Intl and Temporal source selections
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        run: python3 tools/ci/native-prefix/run.py required-test262
      - name: Collect complete configured core Intl and Temporal raw Test262 result
        id: full-raw
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        run: python3 tools/ci/native-prefix/run.py test262
      - name: Capture and independently validate complete original native assertions
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' && steps.full-raw.outcome == 'success' && matrix.backend == 'native' }}
        run: python3 tools/ci/native-prefix/run.py native-assertion-witness
      - name: Require strict ICU or exact reviewed native profile qualification
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        run: python3 tools/ci/native-prefix/run.py test262-profile-gate
      - name: Run exhaustive native Date matrix on one normal compiler row
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' && matrix.backend == 'native' && matrix.compiler == 'gcc' && matrix.sanitizer == 'normal' }}
        run: python3 tools/ci/native-prefix/run.py native-date-exhaustive
      - name: Run normal microbench
        if: matrix.sanitizer == 'normal'
        run: python3 tools/ci/native-prefix/run.py microbench
      - name: Report each Test262 variant timing
        if: always()
        run: |
          report_status=0
          for timing in ci-native-prefix-diagnostics/*-timings.jsonl; do
            test -f "$timing" || continue
            report="${timing%.jsonl}"
            python3 tools/ci/report_test262_timings.py "$timing" \
              --csv "$report.csv" --markdown "$report.md" || report_status=$?
            printf '\n### %s\n' "$(basename "$report")" >> "$GITHUB_STEP_SUMMARY"
            cat "$report.md" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$report_status"
      - name: Preserve reports and exact execution scope
        if: always()
        run: python3 tools/ci/native-prefix/run.py preserve
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-prefix-${{ github.sha }}-${{ matrix.backend }}-${{ matrix.compiler }}-${{ matrix.sanitizer }}
          path: ci-native-prefix-diagnostics/
          if-no-files-found: error
          retention-days: 14
