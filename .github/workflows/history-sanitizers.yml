name: Historical x86-64 sanitizers
run-name: History sanitizers ${{ inputs.batch_id || 'controller registration' }}

on:
  push:
    branches: [scratch-history-ci-control-20261024]
  workflow_dispatch:
    inputs:
      batch_id:
        description: Immutable batch identity from the reviewed validation plan
        required: true
        type: string
      targets:
        description: JSON matrix entries with exact revision, label and sanitizer
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: historical-sanitizers-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Historical validation controller registered; no candidate tested by this job.'

  validate:
    if: github.event_name == 'workflow_dispatch'
    name: ${{ matrix.label }} / ${{ matrix.sanitizer }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include: ${{ fromJSON(inputs.targets) }}
    env:
      CANDIDATE_SHA: ${{ matrix.revision }}
      SANITIZER: ${{ matrix.sanitizer }}
      REQUESTED_PHASES: ${{ matrix.phases || 'repo,core,intl' }}
      REPORT: ${{ github.workspace }}/historical-report
    steps:
      - name: Check out immutable validation tooling
        uses: actions/checkout@v7
        with:
          path: controller
          ref: ${{ github.sha }}
      - name: Check out exact historical candidate
        uses: actions/checkout@v7
        with:
          path: candidate
          ref: ${{ matrix.revision }}
          fetch-depth: 1
      - name: Install compiler and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc clang meson ninja-build make pkg-config
          # Bound sanitizer shadow-map entropy on this disposable Linux runner.
          if test "$(sysctl -n vm.mmap_rnd_bits)" -gt 28; then
            sudo sysctl -w vm.mmap_rnd_bits=28
          fi
      - name: Record hardware and compiler environment
        run: |
          mkdir -p "$REPORT"
          uname -a > "$REPORT/environment.txt"
          lscpu >> "$REPORT/environment.txt"
          gcc --version >> "$REPORT/environment.txt"
          clang --version >> "$REPORT/environment.txt"
          meson --version >> "$REPORT/environment.txt"
          git -C candidate rev-parse HEAD HEAD^{tree} >> "$REPORT/environment.txt"
      - name: Configure maximum available features and selected sanitizer
        id: configure
        run: |
          python3 controller/tools/history_runner.py --source candidate --report "$REPORT" \
            --mode "$SANITIZER" --phase configure
      - name: Compile selected historical configuration
        id: compile
        run: |
          python3 controller/tools/history_runner.py --source candidate --report "$REPORT" \
            --mode "$SANITIZER" --phase build
      - name: Run repository unit tests
        if: ${{ !cancelled() && steps.compile.outcome == 'success' && contains(matrix.phases || 'repo,core,intl', 'repo') }}
        run: |
          python3 controller/tools/history_runner.py --source candidate --report "$REPORT" \
            --mode "$SANITIZER" --phase unit
      - name: Run repository integration tests
        if: ${{ !cancelled() && steps.compile.outcome == 'success' && contains(matrix.phases || 'repo,core,intl', 'repo') }}
        run: |
          python3 controller/tools/history_runner.py --source candidate --report "$REPORT" \
            --mode "$SANITIZER" --phase integration
      - name: Install exact historical Test262 pin and patches
        id: bootstrap
        if: ${{ !cancelled() && steps.compile.outcome == 'success' && (contains(matrix.phases || 'repo,core,intl', 'core') || contains(matrix.phases || 'repo,core,intl', 'intl')) }}
        run: |
          python3 controller/tools/history_runner.py --source candidate --report "$REPORT" \
            --mode "$SANITIZER" --phase bootstrap
      - name: Run core and Temporal Test262 with all runner threads
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' && contains(matrix.phases || 'repo,core,intl', 'core') }}
        run: |
          python3 controller/tools/history_runner.py --source candidate --report "$REPORT" \
            --mode "$SANITIZER" --phase core
      - name: Run supported native Intl Test262 with all runner threads
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' && contains(matrix.phases || 'repo,core,intl', 'intl') }}
        run: |
          python3 controller/tools/history_runner.py --source candidate --report "$REPORT" \
            --mode "$SANITIZER" --phase intl
      - name: Preserve exact configuration and phase diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: history-${{ matrix.label }}-${{ matrix.sanitizer }}-attempt-${{ github.run_attempt }}
          path: |
            historical-report/*.json
            historical-report/*.jsonl
            historical-report/*.log
            historical-report/*.txt
            historical-report/build/meson-logs/
          if-no-files-found: error
