name: ci-tos2

on:
  push:
    branches: [tos2]
  pull_request:
    paths:
      - 'src/quickjs/**'
      - 'tests/**'
      - 'tools/build/test-fixtures.list'
      - '.github/workflows/ci-tos2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sentinel-stack:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: compact-switch
            mode: compact
            dispatch: 0
            gc_stress: false
          - name: wide-switch
            mode: wide
            dispatch: 0
            gc_stress: false
          - name: compact-gc
            mode: compact
            dispatch: 1
            gc_stress: true
    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build
      - name: Build
        run: |
          meson setup build -Dwerror=true -Ddocumentation=disabled \
            -Dvalue_representation=${{ matrix.mode }} \
            -Db_sanitize=address,undefined -Dgc_stress=${{ matrix.gc_stress }} \
            -Dc_args=-DDIRECT_DISPATCH=${{ matrix.dispatch }}
          meson compile -C build -j "$(getconf _NPROCESSORS_ONLN)"
      - name: Run repository tests
        if: ${{ !matrix.gc_stress }}
        run: meson test -C build --suite repo --print-errorlogs --timeout-multiplier 3
      - name: Run GC-stress and TOS ownership tests
        if: ${{ matrix.gc_stress }}
        run: |
          meson test -C build --suite gc-stress --print-errorlogs --timeout-multiplier 3
          meson test -C build test_vm_tos_ownership --print-errorlogs --timeout-multiplier 3
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tos2-${{ matrix.name }}
          path: build/meson-logs/
