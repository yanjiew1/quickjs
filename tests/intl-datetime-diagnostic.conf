# Scratch-only full DateTimeFormat acceptance probe; no new exclusions.
[config]
style=new
mode=both
async=yes
module=yes
verbose=yes
harnessdir=../test262/harness
testdir=../test262/test/intl402/DateTimeFormat

[features]
Symbol
Proxy
Symbol.toStringTag
Reflect
Reflect.construct
BigInt
cross-realm
canonical-tz
Array.prototype.includes
Intl.Locale
Intl.Locale-info
Intl.ListFormat
Intl.PluralRules
Intl.RelativeTimeFormat
Intl.DurationFormat
Intl.DisplayNames
Intl.DisplayNames-v2
Intl.DateTimeFormat-datetimestyle
Intl.DateTimeFormat-dayPeriod
Intl.DateTimeFormat-extend-timezonename
Intl.DateTimeFormat-formatRange
Intl.DateTimeFormat-fractionalSecondDigits
Intl-enumeration
Intl.Era-monthcode
Temporal=auto
Intl.NumberFormat-v3
Intl.NumberFormat-unified
intl-normative-optional
