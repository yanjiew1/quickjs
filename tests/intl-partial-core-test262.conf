# Historical enabled-Intl capability overlay for untagged staging tests.
# Apply only when Intl is enabled: a namespace containing Locale must not imply
# that every other constructor has already landed. Disabled builds still run
# the original files' conditional core portions without this overlay.
# Each requirement disappears at its constructor owner; this is not an
# algorithm/performance exclusion. Final native runs the original cases.
[features]
quickjs-stage-intl-core-constructors=skip

[requirements]
../test262/test/staging/sm/extensions/quote-string-for-nul-character.js = quickjs-stage-intl-core-constructors
../test262/test/staging/sm/Proxy/revoked-get-function-realm-typeerror.js = quickjs-stage-intl-core-constructors
