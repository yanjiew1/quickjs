[config]
# Development Intl profile: exercise the APIs delivered so far. The complete
# Intl suite replaces this focused selection as the remaining services land.
style=new
mode=both
async=yes
module=yes
verbose=yes
harnessdir=../test262/harness
testdir=../test262/test/intl402/Intl/getCanonicalLocales
testdir=../test262/test/intl402/Intl/supportedValuesOf
testdir=../test262/test/intl402/Locale
testdir=../test262/test/intl402/ListFormat
testdir=../test262/test/intl402/PluralRules
testdir=../test262/test/intl402/NumberFormat
testdir=../test262/test/intl402/RelativeTimeFormat
testdir=../test262/test/intl402/DurationFormat
testdir=../test262/test/intl402/DisplayNames
testdir=../test262/test/intl402/String/prototype/toLocaleLowerCase
testdir=../test262/test/intl402/String/prototype/toLocaleUpperCase
testdir=../test262/test/intl402/Temporal/Duration/prototype/toLocaleString

[features]
Symbol
Proxy
Symbol.toStringTag
Reflect
Reflect.construct
BigInt
cross-realm
canonical-tz
Array.prototype.includes
Intl.Locale
Intl.Locale-info
Intl.ListFormat
Intl.PluralRules
Intl.RelativeTimeFormat
Intl.DurationFormat
Intl.DisplayNames
Intl.DisplayNames-v2
Intl-enumeration
Intl.Era-monthcode
Temporal=auto
Intl.NumberFormat-v3
Intl.NumberFormat-unified
intl-normative-optional

[tests]
# This case also consumes the delivered global timeZone inventory.
../test262/test/intl402/DateTimeFormat/timezone-case-insensitive.js
# Era-bearing weekday/clock candidates retain their actual selected fields.
../test262/test/intl402/DateTimeFormat/prototype/resolvedOptions/order.js
# Temporal's default and explicit specific-zone records must retain the zone.
../test262/test/intl402/Temporal/Instant/prototype/toLocaleString/option-timezonename-short.js
../test262/test/intl402/Temporal/ZonedDateTime/prototype/toLocaleString/default-includes-time-and-time-zone-name.js
../test262/test/intl402/Temporal/ZonedDateTime/prototype/toLocaleString/options-timeZoneName-affects-instance-time-zone.js
../test262/test/intl402/Temporal/PlainTime/prototype/toLocaleString/resolved-time-zone.js
../test262/test/intl402/Temporal/PlainTime/prototype/toLocaleString/hourcycle.js

[exclude]
# Locale collation information requires the undelivered Collator service.
../test262/test/intl402/Locale/prototype/getCollations/
../test262/test/intl402/Intl/supportedValuesOf/collations-accepted-by-Collator.js
# This test equates the global currency inventory with English names alone.
# AvailableCanonicalCurrencies imposes no English-name requirement. CLDR 49
# beta4 supplies a plain Chuvash XAD name but no English one; fallback:none
# correctly returns undefined for English. Repository tests cover both locales
# and retain XAD when Chuvash belongs to the selected data profile.
# ECMA-402 730ca2b, reviewed 2026-10-21: #sec-availablecanonicalcurrencies.
../test262/test/intl402/Intl/supportedValuesOf/currencies-accepted-by-DisplayNames.js
# The shared harness unconditionally constructs Collator and DateTimeFormat. Re-enable when those services land; repository tests exercise
# this PluralRules call contract with every currently delivered constructor.
../test262/test/intl402/PluralRules/undefined-newtarget-throws.js
../test262/test/intl402/NumberFormat/this-value-ignored.js

# These exact-output tests prescribe currency range collapse/spacing. The
# native no-collapse policy is explicitly permitted by CollapseNumberRange;
# separators and approximation placement are ILND. Repository range tests
# cover endpoint coercion, rounding, text equality, partitioning and sources.
# ECMA-402 730ca2b, reviewed 2026-10-19: #sec-collapsenumberrange and
# #sec-partitionnumberrangepattern. Revisit if those tests become policy-neutral.
../test262/test/intl402/NumberFormat/prototype/formatRange/en-US.js
../test262/test/intl402/NumberFormat/prototype/formatRange/pt-PT.js
../test262/test/intl402/NumberFormat/prototype/formatRangeToParts/en-US.js
