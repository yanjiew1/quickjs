[config]
# Development Intl profile: exercise the APIs delivered so far. The complete
# Intl suite replaces this focused selection as the remaining services land.
style=new
mode=both
async=yes
module=yes
verbose=yes
harnessdir=../test262/harness
testdir=../test262/test/intl402/Intl/getCanonicalLocales
testdir=../test262/test/intl402/Locale
testdir=../test262/test/intl402/ListFormat
testdir=../test262/test/intl402/PluralRules

[features]
Symbol
Proxy
Symbol.toStringTag
Reflect
Reflect.construct
BigInt
cross-realm
Array.prototype.includes
Intl.Locale
Intl.Locale-info
Intl.ListFormat
Intl.PluralRules
Intl.NumberFormat-v3
Intl.NumberFormat-unified

[exclude]
# Locale preferences are the next data/service increment, not constructor APIs.
../test262/test/intl402/Locale/prototype/getCalendars/
../test262/test/intl402/Locale/prototype/getCollations/
../test262/test/intl402/Locale/prototype/getNumberingSystems/
../test262/test/intl402/Locale/prototype/getTimeZones/
# The shared harness unconditionally constructs Collator, NumberFormat and
# DateTimeFormat. Re-enable when those services land; repository tests exercise
# this PluralRules call contract with every currently delivered constructor.
../test262/test/intl402/PluralRules/undefined-newtarget-throws.js

