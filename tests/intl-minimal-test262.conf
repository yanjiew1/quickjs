# Overlay for the intentionally English-only data profile. The native profile
# runs every delivered-API test in intl-locale-test262.conf without this overlay.
[exclude]
# These DateTimeFormat cases assume German/Japanese/Chinese availability.
# Minimal resolves unsupported requests to English, discarding the request's
# Unicode extension on default-locale fallback as ResolveLocale requires.
# Keep every case for native. Repository tests cover all English hour cycles,
# style/extension/option precedence and unsupported-locale fallback separately.
# ECMA-402 cfc2bb3, reviewed 2026-10-23: #sec-resolvelocale and
# #sec-internal-slots. This is locale availability, not an algorithm exclusion.
../test262/test/intl402/DateTimeFormat/prototype/resolvedOptions/hourCycle.js
../test262/test/intl402/DateTimeFormat/prototype/resolvedOptions/hourCycle-timeStyle.js
../test262/test/intl402/DateTimeFormat/prototype/resolvedOptions/hourCycle-default.js
../test262/test/intl402/DateTimeFormat/prototype/format/german-weekday-no-year.js
../test262/test/intl402/DateTimeFormat/prototype/format/related-year-zh.js
../test262/test/intl402/DateTimeFormat/prototype/formatToParts/related-year-zh.js

# These Temporal cases require ar-EG/de-AT locale data. Minimal's unmatched
# requests correctly select the English/default digits and hour policy instead.
# Native retains all four. Repository tests exercise wrapper fallback, explicit
# hourCycle and boundary PlainDates with en + numberingSystem:arab, preserving
# the non-Latin TimeClip regression independently of Arabic locale availability.
# ECMA-402 cfc2bb3, reviewed 2026-10-23: #sec-resolvelocale and
# #sec-internal-slots; PR1044 d026068e uses the resolved numbering system.
../test262/test/intl402/DateTimeFormat/prototype/format/temporal-objects-no-time-clip-non-latin-numerals.js
../test262/test/intl402/Temporal/Instant/prototype/toLocaleString/basic.js
../test262/test/intl402/Temporal/PlainDateTime/prototype/toLocaleString/basic.js
../test262/test/intl402/Temporal/PlainTime/prototype/toLocaleString/basic.js

# These assert German collations/search order and Thai/Japanese defaults
# without allowing unsupported locales to fall back. Minimal offers en/en-US;
# its resolved English data is covered in test_intl_collator.js. Native keeps
# all three cases. ECMA-402 #sec-internal-slots permits this locale inventory.
../test262/test/intl402/Collator/prototype/resolvedOptions/ignorePunctuation-default.js
../test262/test/intl402/Collator/prototype/resolvedOptions/resolved-collation-unicode-extensions-and-options.js
../test262/test/intl402/Collator/usage-de.js
# These assume Serbian/French/Arabic/German/Chinese support without allowing
# fallback. English argument shapes are covered by test_intl_segmenter.js.
# Locale availability is implementation-defined; keep all cases for native.
../test262/test/intl402/Segmenter/constructor/constructor/locales-valid.js
../test262/test/intl402/Segmenter/constructor/supportedLocalesOf/locales-specific.js
# Duration constructor and locale-inventory cases assume locales absent
# from the intentionally English-only profile; native retains every case.
../test262/test/intl402/DurationFormat/constructor-locales-valid.js
../test262/test/intl402/DurationFormat/supportedLocalesOf/locales-specific.js
# This argument-shape test unconditionally expects "de" for a German request.
# Minimal supports en/en-US; the repository suite checks the same array-like
# argument semantics using EN. ECMA-402 permits fallback for unsupported locales.
../test262/test/intl402/ListFormat/constructor/constructor/locales-valid.js
# These assert Spanish strings regardless of supportedLocalesOf (and their
# locale metadata incorrectly says en-US). Native CI retains all four cases.
../test262/test/intl402/ListFormat/prototype/format/es-es-long.js
../test262/test/intl402/ListFormat/prototype/format/es-es-short.js
../test262/test/intl402/ListFormat/prototype/formatToParts/es-es-long.js
../test262/test/intl402/ListFormat/prototype/formatToParts/es-es-short.js
# These require French notation categories and seven locales' exact category
# inventories without checking supportedLocalesOf. Minimal intentionally has
# English data; repository tests cover notation/options/category ordering in
# English. Full native CI retains both tests.
../test262/test/intl402/PluralRules/prototype/select/notation.js
../test262/test/intl402/PluralRules/prototype/resolvedOptions/plural-categories-order.js

# The scalar BigInt wrapper's German case asserts locale-specific separators
# and percent spacing. Minimal intentionally falls back to English; native keeps
# this case. Other scalar/array wrapper comparisons allow matching fallback.
../test262/test/intl402/BigInt/prototype/toLocaleString/de-DE.js

# These exact-output cases require locales outside the English-only inventory.
