# Overlay for the intentionally English-only data profile. The native profile
# runs every delivered-API test in intl-locale-test262.conf without this overlay.
[config]
# Segmenter first delivers the Unicode-default English profile. Native CLDR
# rules/dictionaries will enable the same directory in the shared selection.
testdir=../test262/test/intl402/Segmenter

[features]
Intl.Segmenter

[exclude]
# These assume Serbian/French/Arabic/German/Chinese support without allowing
# fallback. English argument shapes are covered by test_intl_segmenter.js.
# Locale availability is implementation-defined; keep all cases for native.
../test262/test/intl402/Segmenter/constructor/constructor/locales-valid.js
../test262/test/intl402/Segmenter/constructor/supportedLocalesOf/locales-specific.js
# Duration constructor and locale-inventory cases assume locales absent
# from the intentionally English-only profile; native retains every case.
../test262/test/intl402/DurationFormat/constructor-locales-valid.js
../test262/test/intl402/DurationFormat/supportedLocalesOf/locales-specific.js
# This argument-shape test unconditionally expects "de" for a German request.
# Minimal supports en/en-US; the repository suite checks the same array-like
# argument semantics using EN. ECMA-402 permits fallback for unsupported locales.
../test262/test/intl402/ListFormat/constructor/constructor/locales-valid.js
# These assert Spanish strings regardless of supportedLocalesOf (and their
# locale metadata incorrectly says en-US). Native CI retains all four cases.
../test262/test/intl402/ListFormat/prototype/format/es-es-long.js
../test262/test/intl402/ListFormat/prototype/format/es-es-short.js
../test262/test/intl402/ListFormat/prototype/formatToParts/es-es-long.js
../test262/test/intl402/ListFormat/prototype/formatToParts/es-es-short.js
# These require French notation categories and seven locales' exact category
# inventories without checking supportedLocalesOf. Minimal intentionally has
# English data; repository tests cover notation/options/category ordering in
# English. Full native CI retains both tests.
../test262/test/intl402/PluralRules/prototype/select/notation.js
../test262/test/intl402/PluralRules/prototype/resolvedOptions/plural-categories-order.js

# These exact-output cases require locales outside the English-only inventory.
