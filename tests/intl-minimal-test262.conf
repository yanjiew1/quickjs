# This staging regression assumes German date output without testing locale
# availability. Minimal correctly falls back to English. Keep the original
# test for native and cover the same poisoned-Symbol.split behavior with en
# in test_intl_date_time_format.js. ECMA-402 permits this reduced inventory:
# #sec-internal-slots and #sec-resolvelocale (reviewed 2026-10-24).
# Path requirements normalize the root core config's spelling against this
# overlay's parent directory, so the capability also applies to core runs.
[features]
Intl.DateTimeFormat-locale-de=skip
[requirements]
../test262/test/staging/sm/String/internalUsage.js = Intl.DateTimeFormat-locale-de
