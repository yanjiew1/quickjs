[config]
# Diagnostic inventory: keep failures visible until individually reviewed.
style=new
mode=both
async=yes
module=yes
verbose=yes
harnessdir=../test262/harness
testdir=../test262/test/intl402/DateTimeFormat
testdir=../test262/test/intl402/Date
testdir=../test262/test/intl402/Temporal/Instant/prototype/toLocaleString
testdir=../test262/test/intl402/Temporal/PlainDate/prototype/toLocaleString
testdir=../test262/test/intl402/Temporal/PlainDateTime/prototype/toLocaleString
testdir=../test262/test/intl402/Temporal/PlainMonthDay/prototype/toLocaleString
testdir=../test262/test/intl402/Temporal/PlainTime/prototype/toLocaleString
testdir=../test262/test/intl402/Temporal/PlainYearMonth/prototype/toLocaleString
testdir=../test262/test/intl402/Temporal/ZonedDateTime/prototype/toLocaleString

[features]
Symbol
Proxy
Symbol.toStringTag
Reflect
Reflect.construct
BigInt
cross-realm
Array.prototype.includes
Intl.Locale
Intl.Locale-info
Intl.ListFormat
Intl.PluralRules
Intl.NumberFormat-v3
Intl.NumberFormat-unified
Intl.RelativeTimeFormat
Intl.DurationFormat
Intl.DisplayNames
Intl.DisplayNames-v2
Intl-enumeration
Intl.Era-monthcode
Intl.DateTimeFormat-datetimestyle
Intl.DateTimeFormat-dayPeriod
Intl.DateTimeFormat-extend-timezonename
Intl.DateTimeFormat-formatRange
Intl.DateTimeFormat-fractionalSecondDigits
Temporal=auto
canonical-tz
intl-normative-optional
