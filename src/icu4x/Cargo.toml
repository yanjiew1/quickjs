[package]
name = "quickjs-icu4x"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"

[lib]
path = "lib.rs"
crate-type = ["staticlib"]

[features]
default = []
names = ["dep:icu_provider", "dep:icu_locale", "icu_locale/unstable", "dep:icu_locale_core", "dep:writeable"]
decimals = ["dep:icu_decimal", "dep:icu_locale_core"]
plurals = ["dep:icu_plurals", "dep:icu_plurals_data", "dep:icu_locale_core", "dep:icu_provider"]
segments = ["dep:icu_segmenter", "dep:icu_segmenter_data", "dep:icu_locale_core"]
locales = ["dep:icu_locale", "dep:icu_locale_data", "dep:icu_locale_core", "dep:icu_provider"]
casing = ["dep:icu_casemap", "dep:icu_locale_core", "dep:writeable"]
lists = [
    "dep:icu_locale_fallback",
    "dep:icu_list",
    "dep:icu_list_data",
    "dep:icu_locale_core",
    "dep:icu_provider",
    "icu_provider/std",
    "icu_provider/baked",
    "dep:writeable",
    "dep:zerovec",
]
timezones = ["dep:icu_time", "dep:icu_locale_core", "dep:icu_provider"]
calendars = ["dep:icu_calendar", "dep:icu_calendar_data", "dep:icu_provider"]

[dependencies]
icu_plurals_data = { version = "=2.4.0", optional = true }
icu_decimal = { version = "=2.4.0", default-features = false, features = ["compiled_data", "unstable"], optional = true }
icu_plurals = { version = "=2.4.0", default-features = false, features = ["compiled_data", "unstable"], optional = true }
icu_segmenter = { version = "=2.4.0", default-features = false, features = ["compiled_data", "auto"], optional = true }
icu_segmenter_data = { version = "=2.4.0", optional = true }
icu_locale = { version = "=2.4.0", default-features = false, features = ["compiled_data"], optional = true }
icu_locale_data = { version = "=2.4.0", optional = true }
icu_casemap = { version = "=2.4.0", default-features = false, features = ["compiled_data"], optional = true }
icu_locale_fallback = { version = "=2.4.0", default-features = false, features = ["compiled_data"], optional = true }
icu_list = { version = "=2.4.0", default-features = false, features = ["compiled_data"], optional = true }
icu_list_data = { version = "=2.4.0", optional = true }
writeable = { version = "=0.6.4", default-features = false, optional = true }
zerovec = { version = "=0.11.9", default-features = false, optional = true }
icu_time = { version = "=2.4.0", default-features = false, features = ["compiled_data"], optional = true }
icu_locale_core = { version = "=2.4.0", default-features = false, optional = true }
icu_calendar = { version = "=2.4.0", default-features = false, features = ["compiled_data"], optional = true }
icu_calendar_data = { version = "=2.4.0", optional = true }
icu_provider = { version = "=2.4.0", default-features = false, features = ["alloc"], optional = true }

[profile.release]
opt-level = 3
panic = "unwind"
